<script type="module">

import {
    AutoModel,
    AutoProcessor,
    RawImage,
    env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


// ======================================================
// TRANSFORMERS.JS
// ======================================================

env.allowRemoteModels = true;

env.remoteHost =
    window.location.origin + "/api/model/";

env.remotePathTemplate =
    "{model}/resolve/{revision}";


// ======================================================
// ELEMENTS
// ======================================================

const fileInput =
    document.getElementById("file");

const loadButton =
    document.getElementById("load");

const runButton =
    document.getElementById("run");

const status =
    document.getElementById("status");

const debug =
    document.getElementById("debug");

const original =
    document.getElementById("original");


// ======================================================
// VARIABLES
// ======================================================

let selectedFile = null;

let model = null;

let processor = null;


// ======================================================
// FILE
// ======================================================

fileInput.addEventListener(
    "change",
    () => {

        selectedFile =
            fileInput.files[0];

        if (!selectedFile) {
            return;
        }

        original.src =
            URL.createObjectURL(
                selectedFile
            );

        status.textContent =
            "📷 Фото загружено.\n\n" +
            "Теперь нажми «Загрузить AI-модель».";

    }
);


// ======================================================
// LOAD MODEL
// ======================================================

loadButton.addEventListener(
    "click",
    async () => {

        try {

            loadButton.disabled = true;

            status.textContent =
                "⏳ Загружаем процессор...";


            processor =
                await AutoProcessor.from_pretrained(
                    "studioludens/birefnet-lite-512"
                );


            status.textContent =
                "⏳ Загружаем BiRefNet...";


            try {

                model =
                    await AutoModel.from_pretrained(
                        "studioludens/birefnet-lite-512",
                        {
                            dtype: "fp16",
                            device: "webgpu"
                        }
                    );

                status.textContent =
                    "🚀 BiRefNet работает через WebGPU.";

            } catch (webgpuError) {

                console.warn(
                    "WebGPU error:",
                    webgpuError
                );

                status.textContent =
                    "⚠️ WebGPU не запустился.\n" +
                    "Пробуем WASM...";


                model =
                    await AutoModel.from_pretrained(
                        "studioludens/birefnet-lite-512",
                        {
                            device: "wasm"
                        }
                    );


                status.textContent =
                    "🟢 BiRefNet работает через WASM.";

            }


            runButton.disabled = false;

            status.textContent +=
                "\n\n✅ Модель готова.";

        } catch (error) {

            console.error(error);

            status.innerHTML =
                '<span class="bad">' +
                "❌ Ошибка загрузки:\n\n" +
                error.message +
                "</span>";

            loadButton.disabled = false;

        }

    }
);


// ======================================================
// LOAD ORIGINAL IMAGE INTO CANVAS
// ======================================================

async function loadImageBitmap(
    file
) {

    return await createImageBitmap(
        file
    );

}


// ======================================================
// CREATE MASK
// ======================================================

function createMaskCanvas(
    values,
    width,
    height
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const imageData =
        ctx.createImageData(
            width,
            height
        );


    let min =
        Infinity;

    let max =
        -Infinity;


    // ----------------------------------------------
    // FIND MIN / MAX
    // ----------------------------------------------

    for (
        let i = 0;
        i < values.length;
        i++
    ) {

        const value =
            values[i];


        if (value < min)
            min = value;


        if (value > max)
            max = value;

    }


    const range =
        max - min || 1;


    // ----------------------------------------------
    // NORMALIZE
    // ----------------------------------------------

    for (
        let i = 0;
        i < values.length;
        i++
    ) {

        const normalized =
            (
                values[i] - min
            ) / range;


        const gray =
            Math.round(
                normalized * 255
            );


        const index =
            i * 4;


        imageData.data[index] =
            gray;

        imageData.data[index + 1] =
            gray;

        imageData.data[index + 2] =
            gray;

        imageData.data[index + 3] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return {
        canvas,
        min,
        max,
        range
    };

}


// ======================================================
// RESIZE MASK TO ORIGINAL IMAGE
// ======================================================

function resizeMask(
    maskCanvas,
    width,
    height
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.imageSmoothingEnabled =
        true;

    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(
        maskCanvas,
        0,
        0,
        width,
        height
    );


    return canvas;

}


// ======================================================
// CREATE TRANSPARENT PRODUCT
// ======================================================

function createTransparentVersion(
    bitmap,
    maskCanvas,
    threshold,
    feather
) {

    const width =
        bitmap.width;

    const height =
        bitmap.height;


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    // ----------------------------------------------
    // DRAW ORIGINAL
    // ----------------------------------------------

    ctx.drawImage(
        bitmap,
        0,
        0,
        width,
        height
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const maskData =
        maskCanvas
            .getContext("2d")
            .getImageData(
                0,
                0,
                width,
                height
            );


    // ----------------------------------------------
    // APPLY MASK
    // ----------------------------------------------

    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            let x = 0;
            x < width;
            x++
        ) {

            const i =
                (
                    y * width +
                    x
                ) * 4;


            const maskValue =
                maskData.data[i] /
                255;


            let alpha;


            // ------------------------------------------
            // FEATHER
            // ------------------------------------------

            if (
                maskValue <=
                threshold - feather
            ) {

                alpha = 0;

            } else if (
                maskValue >=
                threshold + feather
            ) {

                alpha = 1;

            } else {

                const t =
                    (
                        maskValue -
                        (
                            threshold -
                            feather
                        )
                    ) /
                    (
                        feather * 2
                    );


                // smoothstep

                alpha =
                    t * t *
                    (
                        3 -
                        2 * t
                    );

            }


            imageData.data[i + 3] =
                Math.round(
                    alpha * 255
                );

        }

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas.toDataURL(
        "image/png"
    );

}


// ======================================================
// RUN
// ======================================================

runButton.addEventListener(
    "click",
    async () => {

        if (!selectedFile) {

            alert(
                "Сначала выбери фото."
            );

            return;

        }


        if (!model || !processor) {

            alert(
                "Сначала загрузи модель."
            );

            return;

        }


        try {

            runButton.disabled = true;


            status.textContent =
                "⏳ Читаем изображение...";


            const image =
                await RawImage.read(
                    selectedFile
                );


            const bitmap =
                await loadImageBitmap(
                    selectedFile
                );


            status.textContent =
                "⏳ Подготавливаем изображение...";


            const {
                pixel_values
            } =
                await processor(
                    image
                );


            status.textContent =
                "🧠 BiRefNet анализирует товар...";


            const output =
                await model({
                    input_image:
                        pixel_values
                });


            console.log(
                "FULL OUTPUT:",
                output
            );


            // ==================================================
            // REAL OUTPUT FROM YOUR MODEL
            // ==================================================

            const outputImage =
                output.output_image;


            if (!outputImage) {

                throw new Error(
                    "BiRefNet не вернул output.output_image"
                );

            }


            console.log(
                "OUTPUT IMAGE:",
                outputImage
            );


            console.log(
                "DIMS:",
                outputImage.dims
            );


            const rawData =
                outputImage
                    .ort_tensor
                    .data;


            // ==================================================
            // CHECK DIMENSIONS
            // ==================================================

            const dims =
                outputImage.dims;


            const maskWidth =
                dims[dims.length - 1];

            const maskHeight =
                dims[dims.length - 2];


            // ==================================================
            // STATS
            // ==================================================

            let min =
                Infinity;

            let max =
                -Infinity;

            let sum =
                0;


            for (
                let i = 0;
                i < rawData.length;
                i++
            ) {

                const value =
                    rawData[i];


                if (value < min)
                    min = value;


                if (value > max)
                    max = value;


                sum += value;

            }


            const average =
                sum /
                rawData.length;


            // ==================================================
            // CREATE NORMALIZED MASK
            // ==================================================

            status.textContent =
                "🎨 Нормализуем маску...";


            const maskResult =
                createMaskCanvas(
                    rawData,
                    maskWidth,
                    maskHeight
                );


            // ==================================================
            // UPSCALE
            // ==================================================

            const resizedMask =
                resizeMask(
                    maskResult.canvas,
                    bitmap.width,
                    bitmap.height
                );


            // ==================================================
            // SHOW MASK
            // ==================================================

            document.getElementById(
                "mask"
            ).src =
                resizedMask.toDataURL(
                    "image/png"
                );


            // ==================================================
            // THREE VARIANTS
            // ==================================================

            /*
                МЯГКИЙ

                Оставляем больше полупрозрачных
                областей.
            */

            const soft =
                createTransparentVersion(
                    bitmap,
                    resizedMask,
                    0.35,
                    0.20
                );


            /*
                СРЕДНИЙ

                Основной вариант.
            */

            const medium =
                createTransparentVersion(
                    bitmap,
                    resizedMask,
                    0.50,
                    0.12
                );


            /*
                ЖЁСТКИЙ

                Агрессивно удаляем фон.
            */

            const hard =
                createTransparentVersion(
                    bitmap,
                    resizedMask,
                    0.65,
                    0.08
                );


            document.getElementById(
                "soft"
            ).src =
                soft;


            document.getElementById(
                "medium"
            ).src =
                medium;


            document.getElementById(
                "hard"
            ).src =
                hard;


            // ==================================================
            // DEBUG
            // ==================================================

            debug.textContent =
`
========================================
BIREFNET BACKGROUND REMOVAL
========================================

Model output:
${JSON.stringify(dims)}

Mask:
${maskWidth} × ${maskHeight}

Raw values:
${rawData.length}

----------------------------------------
RAW
----------------------------------------

Minimum:
${min}

Maximum:
${max}

Average:
${average}

Range:
${maskResult.range}

----------------------------------------
NORMALIZATION
----------------------------------------

Formula:

(value - min) / (max - min)

----------------------------------------
THRESHOLDS
----------------------------------------

Soft:
threshold = 0.35
feather = 0.20

Medium:
threshold = 0.50
feather = 0.12

Hard:
threshold = 0.65
feather = 0.08

========================================
`;


            status.innerHTML =
                '<span class="good">' +
                "🎉 ГОТОВО!" +
                "</span>" +
                "\n\n" +
                "Показаны три варианта удаления фона.";


            runButton.disabled = false;


        } catch (error) {

            console.error(
                "BACKGROUND REMOVAL ERROR:",
                error
            );


            status.innerHTML =
                '<span class="bad">' +
                "❌ ОШИБКА\n\n" +
                error.message +
                "</span>";


            debug.textContent =
                error.stack ||
                error.toString();


            runButton.disabled = false;

        }

    }
);

</script>

</body>
</html>
