<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardly AI — ONNX тест</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f5f8;
    padding: 30px;
}

.box {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
}

button {
    padding: 12px 20px;
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    cursor: pointer;
    margin: 5px;
}

button:disabled {
    opacity: .5;
}

#status {
    margin: 20px 0;
    font-weight: bold;
}

pre {
    background: #111;
    color: #00ff66;
    padding: 20px;
    border-radius: 10px;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>

<div class="box">

<h1>✂️ Cardly AI</h1>

<p>Проверяем загрузку ONNX-модели напрямую</p>

<button id="test">
🚀 Проверить модель
</button>

<div id="status">
Нажми кнопку
</div>

<pre id="log"></pre>

</div>


<script type="module">

const status =
document.getElementById("status");

const log =
document.getElementById("log");


function write(message) {

    log.textContent +=
        message + "\n";

    console.log(message);

}


// ========================================
// Проверяем WebGPU
// ========================================

write("Проверка браузера...");

if (navigator.gpu) {

    write("✅ navigator.gpu найден");

} else {

    write("❌ WebGPU НЕ найден");

}


// ========================================
// Кнопка
// ========================================

document
.getElementById("test")
.addEventListener("click", async () => {

    log.textContent = "";

    try {

        // --------------------------------
        // 1. WebGPU
        // --------------------------------

        status.textContent =
            "⏳ Проверяю WebGPU...";

        write("1. Проверка WebGPU");


        if (!navigator.gpu) {

            throw new Error(
                "Этот браузер не предоставляет WebGPU"
            );

        }


        const adapter =
            await navigator.gpu.requestAdapter();


        if (!adapter) {

            throw new Error(
                "WebGPU найден, но GPU adapter недоступен"
            );

        }


        write(
            "✅ GPU adapter найден"
        );


        write(
            "GPU: " +
            (adapter.name || "unknown")
        );


        // --------------------------------
        // 2. Transformers.js
        // --------------------------------

        status.textContent =
            "⏳ Загружаю Transformers.js...";

        write("");
        write("2. Загрузка Transformers.js");


        const {
            env
        } =
        await import(
            "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
        );


        write(
            "✅ Transformers.js загружен"
        );


        // --------------------------------
        // 3. Проверяем прямой файл
        // --------------------------------

        status.textContent =
            "⏳ Проверяю ONNX-файл...";

        write("");
        write("3. Проверка ONNX-файла");


        const modelURL =
        "https://huggingface.co/studioludens/birefnet-lite-512/resolve/main/onnx/model_fp16.onnx";


        write(
            "URL:"
        );

        write(
            modelURL
        );


        const response =
            await fetch(modelURL);


        write(
            "HTTP: " +
            response.status
        );


        write(
            "OK: " +
            response.ok
        );


        if (!response.ok) {

            throw new Error(
                "ONNX HTTP ошибка: " +
                response.status
            );

        }


        const contentLength =
            response.headers.get(
                "content-length"
            );


        write(
            "Размер: " +
            (
                contentLength
                    ? Math.round(
                        Number(contentLength) /
                        1024 /
                        1024
                      ) + " MB"
                    : "не указан"
            )
        );


        // --------------------------------
        // 4. Загружаем начало файла
        // --------------------------------

        status.textContent =
            "⏳ Проверяю содержимое ONNX...";

        write("");
        write("4. Читаю файл...");


        const buffer =
            await response.arrayBuffer();


        write(
            "Получено байт: " +
            buffer.byteLength
        );


        if (buffer.byteLength === 0) {

            throw new Error(
                "ONNX-файл пустой"
            );

        }


        // --------------------------------
        // 5. Проверяем ONNX header
        // --------------------------------

        const bytes =
            new Uint8Array(
                buffer.slice(0, 20)
            );


        write("");
        write(
            "Первые байты файла:"
        );


        write(
            Array.from(bytes).join(" ")
        );


        // --------------------------------
        // УСПЕХ
        // --------------------------------

        status.textContent =
            "🎉 ONNX-файл успешно загружен!";


        write("");
        write(
            "================================"
        );

        write(
            "✅ ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ"
        );

        write(
            "================================"
        );

        write(
            "WebGPU работает."
        );

        write(
            "Hugging Face доступен."
        );

        write(
            "ONNX-файл доступен."
        );


    } catch (error) {

        status.textContent =
            "❌ Ошибка";

        write("");
        write(
            "================================"
        );

        write(
            "ОШИБКА"
        );

        write(
            "================================"
        );

        write(
            "Тип: " +
            error.name
        );

        write(
            "Сообщение: " +
            error.message
        );

        write(
            "Stack:"
        );

        write(
            error.stack || "нет"
        );

    }

});

</script>

</body>
</html>
