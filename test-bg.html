<script type="module">

import {
    AutoModel,
    AutoProcessor,
    RawImage,
    env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


/* =========================================================
   SETTINGS
========================================================= */

const MODEL_ID = "onnx-community/BiRefNet_512x512-ONNX";

const API_MODEL_URL =
    window.location.origin + "/api/model/";


/* =========================================================
   ELEMENTS
========================================================= */

const fileInput =
    document.getElementById("fileInput");

const runBtn =
    document.getElementById("runBtn");

const status =
    document.getElementById("status");

const originalPreview =
    document.getElementById("originalPreview");

const maskPreview =
    document.getElementById("maskPreview");

const resultPreview =
    document.getElementById("resultPreview");

const originalInfo =
    document.getElementById("originalInfo");

const resultInfo =
    document.getElementById("resultInfo");


/* =========================================================
   TRANSFORMERS.JS CONFIG
========================================================= */

env.allowRemoteModels = true;

env.remoteHost = API_MODEL_URL;

env.remotePathTemplate =
    "{model}/resolve/{revision}";


/*
    Не сохраняем модель между тестами,
    чтобы каждый запуск был максимально чистым.
*/

env.useBrowserCache = true;


/* =========================================================
   GLOBALS
========================================================= */

let model = null;
let processor = null;
let selectedFile = null;
let originalImage = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    status.textContent = text;

    console.log(text);
}


/* =========================================================
   INITIALIZATION
========================================================= */

async function init() {

    try {

        setStatus(
            "⏳ Загружаем processor..."
        );

        processor =
            await AutoProcessor.from_pretrained(
                MODEL_ID
            );

        setStatus(
            "✅ Processor загружен.\n\n" +
            "⏳ Загружаем BiRefNet...\n" +
            "Это может занять некоторое время при первом запуске."
        );


        /*
            Сначала пробуем WebGPU.
            Это значительно быстрее, если браузер
            и видеокарта его поддерживают.
        */

        try {

            if (
                navigator.gpu
            ) {

                const adapter =
                    await navigator.gpu.requestAdapter();

                if (adapter) {

                    console.log(
                        "WebGPU adapter найден."
                    );

                    model =
                        await AutoModel.from_pretrained(
                            MODEL_ID,
                            {
                                dtype: "fp16",
                                device: "webgpu"
                            }
                        );

                    setStatus(
                        "✅ BiRefNet загружен через WebGPU."
                    );

                } else {

                    throw new Error(
                        "WebGPU adapter не найден"
                    );
                }

            } else {

                throw new Error(
                    "WebGPU отсутствует"
                );
            }

        } catch (webgpuError) {

            console.warn(
                "WebGPU не сработал:",
                webgpuError
            );

            setStatus(
                "⚠️ WebGPU недоступен.\n\n" +
                "Пробуем WASM..."
            );


            model =
                await AutoModel.from_pretrained(
                    MODEL_ID,
                    {
                        dtype: "q8",
                        device: "wasm"
                    }
                );


            setStatus(
                "✅ BiRefNet загружен через WASM."
            );
        }


        runBtn.disabled = false;

        setStatus(
            status.textContent +
            "\n\n✅ ГОТОВО.\n" +
            "Выбери фотографию товара."
        );


    } catch (error) {

        console.error(error);

        setStatus(
            "❌ ОШИБКА ЗАГРУЗКИ МОДЕЛИ\n\n" +
            error.message +
            "\n\n" +
            "Открой F12 → Console и посмотри подробности."
        );
    }
}


/* =========================================================
   FILE SELECT
========================================================= */

fileInput.addEventListener(
    "change",
    async () => {

        const file =
            fileInput.files?.[0];

        if (!file) {
            return;
        }

        selectedFile = file;

        const url =
            URL.createObjectURL(file);

        originalPreview.src = url;

        originalInfo.textContent =
            `${file.name} • ${(file.size / 1024 / 1024).toFixed(2)} MB`;

        maskPreview.src = "";
        resultPreview.src = "";

        resultInfo.textContent = "";

        try {

            originalImage =
                await RawImage.fromURL(url);

            console.log(
                "Original image:",
                originalImage.width,
                "x",
                originalImage.height
            );

        } catch (error) {

            console.error(error);

            setStatus(
                "❌ Не удалось прочитать изображение:\n" +
                error.message
            );
        }
    }
);


/* =========================================================
   RUN BACKGROUND REMOVAL
========================================================= */

runBtn.addEventListener(
    "click",
    async () => {

        if (!selectedFile) {

            setStatus(
                "❌ Сначала выбери изображение."
            );

            return;
        }

        if (!model || !processor) {

            setStatus(
                "❌ Модель ещё не загружена."
            );

            return;
        }


        runBtn.disabled = true;

        setStatus(
            "⏳ Анализируем изображение...\n\n" +
            "BiRefNet определяет главный объект."
        );


        try {

            /* -----------------------------------------
               LOAD ORIGINAL
            ----------------------------------------- */

            const image =
                originalImage;


            console.log(
                "Image:",
                image.width,
                image.height
            );


            /* -----------------------------------------
               PREPROCESS
            ----------------------------------------- */

            setStatus(
                "⏳ Подготавливаем изображение..."
            );


            const {
                pixel_values
            } =
                await processor(image);


            console.log(
                "pixel_values:",
                pixel_values
            );


            /* -----------------------------------------
               MODEL
            ----------------------------------------- */

            setStatus(
                "🧠 BiRefNet анализирует товар..."
            );


            const output =
                await model({
                    input_image:
                        pixel_values
                });


            console.log(
                "MODEL OUTPUT:",
                output
            );


            /* -----------------------------------------
               OUTPUT IMAGE
            ----------------------------------------- */

            if (!output.output_image) {

                throw new Error(
                    "BiRefNet не вернул output_image."
                );
            }


            const outputImage =
                output.output_image;


            console.log(
                "output_image:",
                outputImage
            );


            console.log(
                "output_image dims:",
                outputImage.dims
            );


            /*
                В официальном примере BiRefNet:
                output_image[0]
                    -> sigmoid()
                    -> *255
                    -> uint8
                    -> mask

                Именно этот способ используем здесь.
            */


            let maskTensor =
                outputImage[0]
                    .sigmoid()
                    .mul(255)
                    .to("uint8");


            console.log(
                "maskTensor:",
                maskTensor
            );


            /* -----------------------------------------
               MASK → RAW IMAGE
            ----------------------------------------- */

            let mask =
                await RawImage.fromTensor(
                    maskTensor
                );


            console.log(
                "Mask size before resize:",
                mask.width,
                mask.height
            );


            /* -----------------------------------------
               RESIZE MASK
            ----------------------------------------- */

            mask =
                await mask.resize(
                    image.width,
                    image.height
                );


            console.log(
                "Mask size:",
                mask.width,
                mask.height
            );


            /* -----------------------------------------
               SHOW MASK
            ----------------------------------------- */

            const maskCanvas =
                document.createElement("canvas");

            maskCanvas.width =
                mask.width;

            maskCanvas.height =
                mask.height;


            const maskCtx =
                maskCanvas.getContext("2d");


            const maskImageData =
                maskCtx.createImageData(
                    mask.width,
                    mask.height
                );


            const maskData =
                mask.data;


            /*
                RawImage mask может иметь
                1 канал или 3 канала.

                Поэтому обрабатываем оба варианта.
            */

            const channels =
                mask.dims.length === 3
                    ? mask.dims[0]
                    : 1;


            console.log(
                "Mask channels:",
                channels
            );


            for (
                let i = 0;
                i < mask.width * mask.height;
                i++
            ) {

                let value;

                if (channels === 1) {

                    value =
                        maskData[i];

                } else {

                    value =
                        maskData[i * channels];
                }


                maskImageData.data[i * 4] =
                    value;

                maskImageData.data[i * 4 + 1] =
                    value;

                maskImageData.data[i * 4 + 2] =
                    value;

                maskImageData.data[i * 4 + 3] =
                    255;
            }


            maskCtx.putImageData(
                maskImageData,
                0,
                0
            );


            maskPreview.src =
                maskCanvas.toDataURL(
                    "image/png"
                );


            /* -----------------------------------------
               CREATE TRANSPARENT RESULT
            ----------------------------------------- */

            setStatus(
                "✂️ Применяем маску..."
            );


            /*
                Загружаем исходное изображение
                именно как браузерный bitmap.
            */

            const bitmap =
                await createImageBitmap(
                    selectedFile
                );


            const resultCanvas =
                document.createElement("canvas");

            resultCanvas.width =
                bitmap.width;

            resultCanvas.height =
                bitmap.height;


            const resultCtx =
                resultCanvas.getContext(
                    "2d",
                    {
                        willReadFrequently: true
                    }
                );


            /*
                Рисуем оригинал.
            */

            resultCtx.drawImage(
                bitmap,
                0,
                0
            );


            /*
                Получаем пиксели оригинала.
            */

            const originalPixels =
                resultCtx.getImageData(
                    0,
                    0,
                    bitmap.width,
                    bitmap.height
                );


            /*
                Получаем маску.
            */

            const maskPixels =
                maskCtx.getImageData(
                    0,
                    0,
                    mask.width,
                    mask.height
                );


            const originalData =
                originalPixels.data;

            const alphaMask =
                maskPixels.data;


            /*
                Накладываем alpha.

                ВАЖНО:
                Мы НЕ используем жёсткий threshold.

                Значение BiRefNet используется
                как плавная alpha-маска.

                Поэтому края товара
                сохраняются аккуратнее.
            */

            for (
                let i = 0;
                i < originalData.length;
                i += 4
            ) {

                const alpha =
                    alphaMask[i];

                originalData[i + 3] =
                    alpha;
            }


            resultCtx.putImageData(
                originalPixels,
                0,
                0
            );


            /* -----------------------------------------
               RESULT
            ----------------------------------------- */

            const resultUrl =
                resultCanvas.toDataURL(
                    "image/png"
                );


            resultPreview.src =
                resultUrl;


            resultInfo.textContent =
                `${bitmap.width} × ${bitmap.height}px • PNG с прозрачностью`;


            setStatus(
                "🎉 ГОТОВО!\n\n" +
                "Слева — исходник.\n" +
                "В центре — маска BiRefNet.\n" +
                "Справа — результат с прозрачным фоном."
            );


        } catch (error) {

            console.error(
                "BACKGROUND REMOVAL ERROR:",
                error
            );


            setStatus(
                "❌ ОШИБКА\n\n" +
                error.message +
                "\n\n" +
                "Подробности смотри в F12 → Console."
            );

        } finally {

            runBtn.disabled = false;
        }

    }
);


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
