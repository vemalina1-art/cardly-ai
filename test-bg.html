<html lang="ru">

<script type="module">

import {
    AutoModel,
    AutoProcessor,
    RawImage,
    env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


/* =========================================================
   MODEL
========================================================= */

const MODEL_ID =
    "onnx-community/BiRefNet_512x512-ONNX";


/* =========================================================
   WORKER PROXY
========================================================= */

const API_MODEL_URL =
    window.location.origin + "/api/model/";


/* =========================================================
   TRANSFORMERS.JS CONFIG
========================================================= */

env.allowRemoteModels = true;


/*
    Наш Cloudflare Worker.
*/

env.remoteHost =
    API_MODEL_URL;


/*
    ВАЖНО!

    Здесь обязательно должен быть {file}.

    Именно он превращает:

    {model}/resolve/{revision}/{file}

    в:

    onnx-community/
    BiRefNet_512x512-ONNX/
    resolve/
    main/
    preprocessor_config.json
*/

env.remotePathTemplate =
    "{model}/resolve/{revision}/{file}";


/*
    Кэш браузера разрешён.
*/

env.useBrowserCache = true;


/* =========================================================
   ELEMENTS
========================================================= */

const fileInput =
    document.getElementById("fileInput");

const runBtn =
    document.getElementById("runBtn");

const status =
    document.getElementById("status");

const originalPreview =
    document.getElementById("originalPreview");

const maskPreview =
    document.getElementById("maskPreview");

const resultPreview =
    document.getElementById("resultPreview");

const originalInfo =
    document.getElementById("originalInfo");

const resultInfo =
    document.getElementById("resultInfo");


/* =========================================================
   GLOBALS
========================================================= */

let model = null;

let processor = null;

let selectedFile = null;

let originalImage = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

    status.textContent = message;

    console.log(message);
}


/* =========================================================
   INITIALIZE MODEL
========================================================= */

async function init() {

    try {

        setStatus(
            "⏳ Загружаем processor...\n\n" +
            "Модель: " +
            MODEL_ID
        );


        /* -----------------------------------------------
           PROCESSOR
        ----------------------------------------------- */

        processor =
            await AutoProcessor.from_pretrained(
                MODEL_ID
            );


        setStatus(
            "✅ Processor загружен.\n\n" +
            "⏳ Загружаем BiRefNet...\n\n" +
            "Первый запуск может быть долгим."
        );


        /* -----------------------------------------------
           TRY WEBGPU
        ----------------------------------------------- */

        try {

            if (!navigator.gpu) {

                throw new Error(
                    "WebGPU отсутствует в браузере."
                );
            }


            const adapter =
                await navigator.gpu.requestAdapter();


            if (!adapter) {

                throw new Error(
                    "WebGPU adapter не найден."
                );
            }


            console.log(
                "WebGPU adapter найден."
            );


            model =
                await AutoModel.from_pretrained(
                    MODEL_ID,
                    {
                        dtype: "fp16",
                        device: "webgpu"
                    }
                );


            setStatus(
                "✅ BiRefNet загружен через WebGPU.\n\n" +
                "Можно выбирать изображение."
            );


        } catch (webgpuError) {

            console.warn(
                "WebGPU не сработал:",
                webgpuError
            );


            setStatus(
                "⚠️ WebGPU не запустился.\n\n" +
                "⏳ Переходим на WASM..."
            );


            /* -------------------------------------------
               WASM FALLBACK
            ------------------------------------------- */

            model =
                await AutoModel.from_pretrained(
                    MODEL_ID,
                    {
                        dtype: "q8",
                        device: "wasm"
                    }
                );


            setStatus(
                "✅ BiRefNet загружен через WASM.\n\n" +
                "Можно выбирать изображение."
            );
        }


        runBtn.disabled = false;


    } catch (error) {

        console.error(
            "MODEL LOAD ERROR:",
            error
        );


        setStatus(
            "❌ ОШИБКА ЗАГРУЗКИ МОДЕЛИ\n\n" +
            error.message +
            "\n\n" +
            "Открой F12 → Console."
        );
    }
}


/* =========================================================
   FILE SELECT
========================================================= */

fileInput.addEventListener(
    "change",
    async () => {

        const file =
            fileInput.files?.[0];


        if (!file) {
            return;
        }


        selectedFile = file;


        /* -----------------------------------------------
           ORIGINAL PREVIEW
        ----------------------------------------------- */

        const url =
            URL.createObjectURL(file);


        originalPreview.src =
            url;


        originalInfo.textContent =
            `${file.name} • ` +
            `${(file.size / 1024 / 1024).toFixed(2)} MB`;


        maskPreview.src = "";

        resultPreview.src = "";

        resultInfo.textContent = "";


        /* -----------------------------------------------
           READ IMAGE
        ----------------------------------------------- */

        try {

            originalImage =
                await RawImage.fromURL(
                    url
                );


            console.log(
                "Original:",
                originalImage.width,
                "x",
                originalImage.height
            );


            setStatus(
                "✅ Изображение загружено.\n\n" +
                "Нажми «Удалить фон»."
            );


        } catch (error) {

            console.error(error);


            setStatus(
                "❌ Не удалось прочитать изображение.\n\n" +
                error.message
            );
        }

    }
);


/* =========================================================
   BACKGROUND REMOVAL
========================================================= */

runBtn.addEventListener(
    "click",
    async () => {

        if (!selectedFile) {

            setStatus(
                "❌ Сначала выбери изображение."
            );

            return;
        }


        if (!model || !processor) {

            setStatus(
                "❌ Модель ещё не загружена."
            );

            return;
        }


        runBtn.disabled = true;


        try {

            /* =============================================
               IMAGE
            ============================================= */

            const image =
                originalImage;


            if (!image) {

                throw new Error(
                    "Изображение не загружено."
                );
            }


            /* =============================================
               PROCESSOR
            ============================================= */

            setStatus(
                "⏳ Подготавливаем изображение..."
            );


            const {
                pixel_values
            } =
                await processor(
                    image
                );


            console.log(
                "pixel_values:",
                pixel_values
            );


            /* =============================================
               MODEL
            ============================================= */

            setStatus(
                "🧠 BiRefNet анализирует товар..."
            );


            const output =
                await model({

                    input_image:
                        pixel_values

                });


            console.log(
                "MODEL OUTPUT:",
                output
            );


            /* =============================================
               CHECK OUTPUT
            ============================================= */

            if (!output.output_image) {

                throw new Error(
                    "BiRefNet не вернул output_image."
                );
            }


            const outputImage =
                output.output_image;


            console.log(
                "output_image:",
                outputImage
            );


            console.log(
                "output_image dims:",
                outputImage.dims
            );


            /* =============================================
               SIGMOID → 0..255
            ============================================= */

            let maskTensor =
                outputImage[0]
                    .sigmoid()
                    .mul(255)
                    .to("uint8");


            console.log(
                "maskTensor:",
                maskTensor
            );


            /* =============================================
               TENSOR → RAW IMAGE
            ============================================= */

            let mask =
                await RawImage.fromTensor(
                    maskTensor
                );


            console.log(
                "Mask:",
                mask.width,
                "x",
                mask.height
            );


            /* =============================================
               RESIZE MASK
            ============================================= */

            mask =
                await mask.resize(
                    image.width,
                    image.height
                );


            console.log(
                "Resized mask:",
                mask.width,
                "x",
                mask.height
            );


            /* =============================================
               MASK CANVAS
            ============================================= */

            const maskCanvas =
                document.createElement(
                    "canvas"
                );


            maskCanvas.width =
                mask.width;

            maskCanvas.height =
                mask.height;


            const maskCtx =
                maskCanvas.getContext(
                    "2d"
                );


            const maskImageData =
                maskCtx.createImageData(
                    mask.width,
                    mask.height
                );


            const maskData =
                mask.data;


            let channels = 1;


            if (
                mask.dims &&
                mask.dims.length === 3
            ) {

                channels =
                    mask.dims[0];
            }


            console.log(
                "Mask channels:",
                channels
            );


            /* =============================================
               DRAW MASK
            ============================================= */

            for (
                let i = 0;
                i < mask.width * mask.height;
                i++
            ) {

                let value;


                if (channels === 1) {

                    value =
                        maskData[i];

                } else {

                    value =
                        maskData[
                            i * channels
                        ];
                }


                maskImageData.data[
                    i * 4
                ] =
                    value;


                maskImageData.data[
                    i * 4 + 1
                ] =
                    value;


                maskImageData.data[
                    i * 4 + 2
                ] =
                    value;


                maskImageData.data[
                    i * 4 + 3
                ] =
                    255;
            }


            maskCtx.putImageData(
                maskImageData,
                0,
                0
            );


            maskPreview.src =
                maskCanvas.toDataURL(
                    "image/png"
                );


            /* =============================================
               CREATE RESULT
            ============================================= */

            setStatus(
                "✂️ Создаём прозрачный PNG..."
            );


            const bitmap =
                await createImageBitmap(
                    selectedFile
                );


            const resultCanvas =
                document.createElement(
                    "canvas"
                );


            resultCanvas.width =
                bitmap.width;

            resultCanvas.height =
                bitmap.height;


            const resultCtx =
                resultCanvas.getContext(
                    "2d",
                    {
                        willReadFrequently:
                            true
                    }
                );


            /* =============================================
               DRAW ORIGINAL
            ============================================= */

            resultCtx.drawImage(
                bitmap,
                0,
                0
            );


            /* =============================================
               ORIGINAL PIXELS
            ============================================= */

            const originalPixels =
                resultCtx.getImageData(
                    0,
                    0,
                    bitmap.width,
                    bitmap.height
                );


            /* =============================================
               MASK PIXELS
            ============================================= */

            const maskPixels =
                maskCtx.getImageData(
                    0,
                    0,
                    mask.width,
                    mask.height
                );


            const originalData =
                originalPixels.data;


            const alphaData =
                maskPixels.data;


            /* =============================================
               APPLY ALPHA
            ============================================= */

            for (
                let i = 0;
                i < originalData.length;
                i += 4
            ) {

                /*
                    Красный канал маски
                    используется как alpha.
                */

                originalData[i + 3] =
                    alphaData[i];
            }


            resultCtx.putImageData(
                originalPixels,
                0,
                0
            );


            /* =============================================
               EXPORT
            ============================================= */

            const resultUrl =
                resultCanvas.toDataURL(
                    "image/png"
                );


            resultPreview.src =
                resultUrl;


            resultInfo.textContent =
                `${bitmap.width} × ` +
                `${bitmap.height}px • ` +
                `PNG с прозрачным фоном`;


            setStatus(
                "🎉 ГОТОВО!\n\n" +
                "1. Оригинал — исходное фото.\n" +
                "2. Маска — что BiRefNet считает главным объектом.\n" +
                "3. Результат — прозрачный PNG."
            );


        } catch (error) {

            console.error(
                "BACKGROUND REMOVAL ERROR:",
                error
            );


            setStatus(
                "❌ ОШИБКА\n\n" +
                error.message +
                "\n\n" +
                "Открой F12 → Console для подробностей."
            );


        } finally {

            runBtn.disabled = false;
        }

    }
);


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
