<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Cardly AI — диагностика</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f5f8;
    padding: 30px;
}

.box {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
}

button {
    padding: 12px 20px;
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    cursor: pointer;
    margin: 5px;
}

pre {
    background: #111;
    color: #0f0;
    padding: 20px;
    border-radius: 10px;
    white-space: pre-wrap;
    word-break: break-word;
}

#status {
    margin: 20px 0;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="box">

<h1>✂️ Cardly AI</h1>

<h3>Диагностика загрузки AI</h3>

<button id="testFetch">
Проверить Hugging Face
</button>

<button id="testTransformers">
Проверить Transformers.js
</button>

<button id="testModel">
Загрузить модель
</button>

<div id="status">
Готово к проверке
</div>

<pre id="log"></pre>

</div>


<script type="module">

const status =
document.getElementById("status");

const log =
document.getElementById("log");


function write(text) {

    log.textContent +=
        "\n" + text;

    console.log(text);
}


function clearLog() {

    log.textContent = "";

}


// --------------------------------
// 1. Проверяем Hugging Face
// --------------------------------

document
.getElementById("testFetch")
.addEventListener("click", async () => {

    clearLog();

    status.textContent =
        "⏳ Проверяю Hugging Face...";

    try {

        const url =
        "https://huggingface.co/studioludens/birefnet-lite-512/resolve/main/config.json";

        write("URL:");
        write(url);

        const response =
        await fetch(url);

        write(
            "HTTP статус: " +
            response.status
        );

        write(
            "OK: " +
            response.ok
        );

        const text =
        await response.text();

        write(
            "Ответ:\n" +
            text
        );

        status.textContent =
            "✅ Hugging Face доступен";

    }

    catch (error) {

        write(
            "ОШИБКА:\n" +
            error.stack
        );

        status.textContent =
            "❌ Hugging Face недоступен";

    }

});


// --------------------------------
// 2. Проверяем Transformers.js
// --------------------------------

document
.getElementById("testTransformers")
.addEventListener("click", async () => {

    clearLog();

    status.textContent =
        "⏳ Загружаю Transformers.js...";

    try {

        const transformers =
        await import(
            "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
        );

        write(
            "Transformers.js загружен."
        );

        write(
            "AutoModel: " +
            !!transformers.AutoModel
        );

        write(
            "AutoProcessor: " +
            !!transformers.AutoProcessor
        );

        write(
            "RawImage: " +
            !!transformers.RawImage
        );

        status.textContent =
            "✅ Transformers.js работает";

    }

    catch (error) {

        write(
            "ОШИБКА:\n" +
            error.stack
        );

        status.textContent =
            "❌ Transformers.js не загрузился";

    }

});


// --------------------------------
// 3. Загружаем модель
// --------------------------------

document
.getElementById("testModel")
.addEventListener("click", async () => {

    clearLog();

    status.textContent =
        "⏳ Начинаю загрузку модели...";

    try {

        const {

            AutoModel,
            AutoProcessor

        } =
        await import(
            "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
        );


        write(
            "Transformers.js OK"
        );


        const MODEL =
        "studioludens/birefnet-lite-512";


        write(
            "Модель: " +
            MODEL
        );


        write(
            "Пробую загрузить модель..."
        );


        const model =
        await AutoModel.from_pretrained(
            MODEL,
            {
                dtype: "fp16",
                device: "webgpu"
            }
        );


        write(
            "МОДЕЛЬ ЗАГРУЖЕНА!"
        );


        write(
            "Теперь загружаю processor..."
        );


        const processor =
        await AutoProcessor.from_pretrained(
            MODEL
        );


        write(
            "PROCESSOR ЗАГРУЖЕН!"
        );


        status.textContent =
            "🎉 AI-модель полностью загрузилась";

    }

    catch (error) {

        write(
            "\n========== ОШИБКА ==========\n"
        );

        write(
            "Тип: " +
            error.name
        );

        write(
            "Сообщение: " +
            error.message
        );

        write(
            "\nStack:\n" +
            error.stack
        );

        status.textContent =
            "❌ Ошибка загрузки";

    }

});

</script>

</body>
</html>
