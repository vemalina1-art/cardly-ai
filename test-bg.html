<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardly AI — Background Removal Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #111;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,.06);
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px 5px 5px 0;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        input[type="file"] {
            margin: 10px 0 15px;
        }

        #status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            background: #f1f3f5;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .image-box {
            min-height: 350px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
        }

        .checker {
            background-color: #eee;
            background-image:
                linear-gradient(45deg, #ddd 25%, transparent 25%),
                linear-gradient(-45deg, #ddd 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ddd 75%),
                linear-gradient(-45deg, transparent 75%, #ddd 75%);
            background-size: 30px 30px;
            background-position:
                0 0,
                0 15px,
                15px -15px,
                -15px 0;
        }

        .image-box img {
            max-width: 100%;
            max-height: 600px;
            display: block;
        }

        .label {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(0,0,0,.75);
            color: white;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            .images {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cardly AI — Background Removal</h1>

    <div class="subtitle">
        Тест BiRefNet через Cloudflare Worker
    </div>

    <div class="panel">

        <button id="diagnosticButton">
            🔎 Проверить подключение
        </button>

        <button id="loadButton">
            🤖 Загрузить AI-модель
        </button>

        <div id="status">
            Готово к проверке.
        </div>

    </div>

    <div class="panel">

        <input
            id="fileInput"
            type="file"
            accept="image/*"
        >

        <br>

        <button
            id="removeButton"
            disabled
        >
            ✂️ Удалить фон
        </button>

    </div>

    <div class="panel">

        <div class="images">

            <div class="image-box">

                <div class="label">
                    Исходное изображение
                </div>

                <img
                    id="originalImage"
                    alt=""
                >

            </div>

            <div class="image-box checker">

                <div class="label">
                    Результат
                </div>

                <img
                    id="resultImage"
                    alt=""
                >

            </div>

        </div>

    </div>

</div>


<script type="module">

import {
    AutoModel,
    AutoProcessor,
    RawImage,
    env
} from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


/* ==========================================
   TRANSFORMERS.JS
========================================== */

env.allowRemoteModels = true;

env.remoteHost =
    window.location.origin + "/api/model/";

env.remotePathTemplate =
    "{model}/resolve/{revision}";


/* ==========================================
   ELEMENTS
========================================== */

const status =
    document.getElementById("status");

const diagnosticButton =
    document.getElementById("diagnosticButton");

const loadButton =
    document.getElementById("loadButton");

const removeButton =
    document.getElementById("removeButton");

const fileInput =
    document.getElementById("fileInput");

const originalImage =
    document.getElementById("originalImage");

const resultImage =
    document.getElementById("resultImage");


/* ==========================================
   VARIABLES
========================================== */

let model = null;
let processor = null;
let selectedFile = null;


/* ==========================================
   STATUS
========================================== */

function setStatus(message) {

    status.textContent = message;

}


/* ==========================================
   FILE
========================================== */

fileInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        selectedFile = file;

        originalImage.src =
            URL.createObjectURL(file);

        resultImage.src = "";

        setStatus(
            "✅ Изображение выбрано.\n\n" +
            "Теперь можно удалить фон."
        );

    }
);


/* ==========================================
   DIAGNOSTIC
========================================== */

diagnosticButton.addEventListener(
    "click",
    async () => {

        diagnosticButton.disabled = true;

        let report = "";


        try {

            report +=
                "1. Проверка WebGPU\n";


            if ("gpu" in navigator) {

                try {

                    const adapter =
                        await navigator.gpu.requestAdapter();

                    if (adapter) {

                        report +=
                            "✅ GPU adapter найден\n";

                        report +=
                            "GPU: " +
                            (
                                adapter.info?.device ||
                                adapter.info?.description ||
                                "unknown"
                            ) +
                            "\n\n";

                    } else {

                        report +=
                            "⚠️ GPU adapter не найден\n\n";

                    }

                } catch (error) {

                    report +=
                        "⚠️ WebGPU ошибка: " +
                        error.message +
                        "\n\n";

                }

            } else {

                report +=
                    "⚠️ WebGPU отсутствует\n\n";

            }


            report +=
                "2. Проверка Transformers.js\n";

            report +=
                "✅ Transformers.js загружен\n";

            report +=
                "AutoModel: " +
                (!!AutoModel) +
                "\n";

            report +=
                "AutoProcessor: " +
                (!!AutoProcessor) +
                "\n";

            report +=
                "RawImage: " +
                (!!RawImage) +
                "\n\n";


            report +=
                "3. Проверка Cloudflare Proxy\n";


            const configURL =
                window.location.origin +
                "/api/model/config.json";


            report +=
                "URL:\n" +
                configURL +
                "\n";


            const configResponse =
                await fetch(
                    configURL,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (!configResponse.ok) {

                throw new Error(
                    "Proxy config HTTP " +
                    configResponse.status
                );

            }


            const config =
                await configResponse.json();


            report +=
                "✅ config.json загружен через Worker\n";


            report +=
                "model_type: " +
                (
                    config.model_type ||
                    "unknown"
                ) +
                "\n\n";


            report +=
                "4. Проверка preprocessor_config.json\n";


            const preprocessorURL =
                window.location.origin +
                "/api/model/preprocessor_config.json";


            const preprocessorResponse =
                await fetch(
                    preprocessorURL,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (!preprocessorResponse.ok) {

                throw new Error(
                    "Preprocessor HTTP " +
                    preprocessorResponse.status
                );

            }


            report +=
                "✅ preprocessor_config.json доступен\n\n";


            report +=
                "5. Проверка ONNX через Worker\n";


            const onnxURL =
                window.location.origin +
                "/api/model/onnx/model_fp16.onnx";


            const onnxResponse =
                await fetch(
                    onnxURL,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (!onnxResponse.ok) {

                throw new Error(
                    "ONNX HTTP " +
                    onnxResponse.status
                );

            }


            report +=
                "✅ ONNX-файл доступен через Worker\n\n";


            report +=
                "================================\n";

            report +=
                "🎉 ПРОВЕРКА ПРОЙДЕНА\n";

            report +=
                "================================\n\n";

            report +=
                "Браузер → Cloudflare → Hugging Face работает.\n\n";

            report +=
                "Теперь нажми «Загрузить AI-модель».";


            setStatus(report);


        } catch (error) {

            report +=
                "\n================================\n";

            report +=
                "❌ ОШИБКА\n";

            report +=
                "================================\n\n";

            report +=
                "Тип: " +
                error.name +
                "\n\n";

            report +=
                "Сообщение:\n" +
                error.message;


            setStatus(report);

            console.error(error);

        }


        diagnosticButton.disabled = false;

    }
);


/* ==========================================
   LOAD MODEL
========================================== */

loadButton.addEventListener(
    "click",
    async () => {

        loadButton.disabled = true;


        try {

            setStatus(
                "⏳ Загружаю processor BiRefNet...\n\n" +
                "Первый запуск может быть долгим."
            );


            processor =
                await AutoProcessor.from_pretrained(
                    "studioludens/birefnet-lite-512"
                );


            setStatus(
                "✅ Processor загружен.\n\n" +
                "⏳ Загружаю AI-модель BiRefNet..."
            );


            try {

                model =
                    await AutoModel.from_pretrained(
                        "studioludens/birefnet-lite-512",
                        {
                            dtype: "fp16",
                            device: "webgpu"
                        }
                    );


                setStatus(
                    "🎉 BiRefNet успешно загружен через WebGPU!"
                );


            } catch (webgpuError) {

                console.warn(
                    "WebGPU error:",
                    webgpuError
                );


                setStatus(
                    "⚠️ WebGPU не запустился.\n\n" +
                    "Пробую WASM..."
                );


                model =
                    await AutoModel.from_pretrained(
                        "studioludens/birefnet-lite-512",
                        {
                            dtype: "q8",
                            device: "wasm"
                        }
                    );


                setStatus(
                    "🎉 BiRefNet успешно загружен через WASM!"
                );

            }


            removeButton.disabled = false;


        } catch (error) {

            console.error(
                "MODEL ERROR:",
                error
            );


            setStatus(
                "❌ Ошибка загрузки AI-модели.\n\n" +
                "Тип: " +
                error.name +
                "\n\n" +
                "Сообщение:\n" +
                error.message
            );


            loadButton.disabled = false;

        }

    }
);


/* ==========================================
   GET MODEL TENSOR
========================================== */

function findMaskTensor(output) {

    console.log(
        "========== MODEL OUTPUT =========="
    );

    console.log(output);

    console.log(
        "OUTPUT KEYS:",
        Object.keys(output || {})
    );


    /*
     * 1. Самый вероятный вариант
     */

    if (output?.logits) {
        return output.logits;
    }


    /*
     * 2. Некоторые модели
     * возвращают prediction
     */

    if (output?.prediction) {
        return output.prediction;
    }


    /*
     * 3. Возможные варианты
     */

    if (output?.predictions) {
        return output.predictions;
    }


    if (output?.output) {
        return output.output;
    }


    if (output?.masks) {
        return output.masks;
    }


    /*
     * 4. Если результат является массивом
     */

    if (Array.isArray(output)) {

        for (const item of output) {

            if (
                item &&
                typeof item === "object" &&
                typeof item.sigmoid === "function"
            ) {

                return item;

            }

        }

    }


    /*
     * 5. Ищем любой объект,
     * который похож на Tensor
     */

    if (
        output &&
        typeof output === "object"
    ) {

        for (const key of Object.keys(output)) {

            const value =
                output[key];


            if (
                value &&
                typeof value === "object" &&
                typeof value.sigmoid === "function"
            ) {

                console.log(
                    "Найден Tensor:",
                    key
                );

                return value;

            }

        }

    }


    return null;

}


/* ==========================================
   REMOVE BACKGROUND
========================================== */

removeButton.addEventListener(
    "click",
    async () => {

        if (!model || !processor) {

            setStatus(
                "❌ Сначала загрузите AI-модель."
            );

            return;

        }


        if (!selectedFile) {

            setStatus(
                "❌ Сначала выберите изображение."
            );

            return;

        }


        removeButton.disabled = true;


        try {

            /* IMAGE */

            setStatus(
                "⏳ Читаю изображение..."
            );


            const image =
                await RawImage.read(
                    selectedFile
                );


            /* PROCESSOR */

            setStatus(
                "⏳ Подготавливаю изображение..."
            );


            const {
                pixel_values
            } =
                await processor(image);


            /* MODEL */

            setStatus(
                "⏳ BiRefNet удаляет фон..."
            );


            const output =
                await model({
                    input_image:
                        pixel_values
                });


            console.log(
                "Полный результат модели:",
                output
            );


            /* FIND MASK */

            const maskTensor =
                findMaskTensor(output);


            if (!maskTensor) {

                throw new Error(
                    "Не найден выходной Tensor модели.\n\n" +
                    "Откройте консоль браузера (F12) и пришлите мне блок:\n" +
                    "\"MODEL OUTPUT\"."
                );

            }


            console.log(
                "Найден mask tensor:",
                maskTensor
            );


            /* SIGMOID */

            let mask =
                maskTensor.sigmoid();


            /*
             * TENSOR → IMAGE
             */

            mask =
                await RawImage.fromTensor(
                    mask
                );


            /*
             * RESIZE
             */

            mask =
                await mask.resize(
                    image.width,
                    image.height
                );


            /*
             * CANVAS
             */

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                image.width;

            canvas.height =
                image.height;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            /*
             * ORIGINAL
             */

            const sourceCanvas =
                image.toCanvas();


            ctx.drawImage(
                sourceCanvas,
                0,
                0,
                image.width,
                image.height
            );


            /*
             * PIXELS
             */

            const imageData =
                ctx.getImageData(
                    0,
                    0,
                    image.width,
                    image.height
                );


            const pixels =
                imageData.data;


            const maskData =
                mask.data;


            /*
             * APPLY MASK
             */

            for (
                let i = 0;
                i < pixels.length;
                i += 4
            ) {

                const index =
                    i / 4;


                let alpha =
                    maskData[index];


                /*
                 * Если значение оказалось
                 * 0–255, переводим в 0–1.
                 */

                if (alpha > 1) {

                    alpha =
                        alpha / 255;

                }


                alpha =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            alpha
                        )
                    );


                /*
                 * Немного смягчаем края.
                 */

                alpha =
                    Math.pow(
                        alpha,
                        0.8
                    );


                pixels[i + 3] =
                    Math.round(
                        alpha * 255
                    );

            }


            /*
             * PUT PIXELS
             */

            ctx.putImageData(
                imageData,
                0,
                0
            );


            /*
             * RESULT
             */

            resultImage.src =
                canvas.toDataURL(
                    "image/png"
                );


            setStatus(
                "🎉 Готово!\n\n" +
                "Фон удалён.\n\n" +
                "Справа показан результат " +
                "с прозрачным фоном."
            );


        } catch (error) {

            console.error(
                "BACKGROUND REMOVAL ERROR:",
                error
            );


            setStatus(
                "❌ Ошибка удаления фона.\n\n" +
                "Тип: " +
                error.name +
                "\n\n" +
                "Сообщение:\n" +
                error.message +
                "\n\n" +
                "Открой F12 → Console и, если ошибка повторится, пришли мне блок:\n" +
                "MODEL OUTPUT"
            );

        }


        removeButton.disabled = false;

    }
);

</script>

</body>
</html>
