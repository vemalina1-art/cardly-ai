import { pipeline } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


const MODEL =
  "studioludens/birefnet-lite-512";


const imageInput =
  document.getElementById("imageInput");

const removeBtn =
  document.getElementById("removeBtn");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");


let imageFile = null;
let remover = null;


// ----------------------------------
// Выбор фотографии
// ----------------------------------

imageInput.addEventListener("change", (event) => {

  imageFile =
    event.target.files[0];

  if (!imageFile) return;

  result.src =
    URL.createObjectURL(imageFile);

  status.textContent =
    "Фото выбрано. Нажми «Убрать фон».";

});


// ----------------------------------
// Удаление фона
// ----------------------------------

removeBtn.addEventListener("click", async () => {

  if (!imageFile) {

    status.textContent =
      "Сначала выбери фотографию.";

    return;
  }


  try {

    removeBtn.disabled = true;


    // Загружаем модель только один раз

    if (!remover) {

      status.textContent =
        "⏳ Загружаю AI-модель. Первый запуск может занять некоторое время...";


      remover =
        await pipeline(
          "image-segmentation",
          MODEL,
          {
            device: "webgpu"
          }
        );

    }


    status.textContent =
      "✂️ AI удаляет фон...";


    const output =
      await remover(imageFile);


    console.log("AI OUTPUT:", output);


    if (!output || !output[0]) {

      throw new Error(
        "Модель не вернула результат"
      );

    }


    const mask =
      output[0].mask;


    // Загружаем исходное фото

    const image =
      await createImageBitmap(imageFile);


    const canvas =
      document.createElement("canvas");

    canvas.width =
      image.width;

    canvas.height =
      image.height;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      image,
      0,
      0
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    // Маска модели

    const maskCanvas =
      document.createElement("canvas");

    maskCanvas.width =
      mask.width;

    maskCanvas.height =
      mask.height;


    const maskCtx =
      maskCanvas.getContext("2d");


    const maskImageData =
      new ImageData(
        new Uint8ClampedArray(mask.data),
        mask.width,
        mask.height
      );


    maskCtx.putImageData(
      maskImageData,
      0,
      0
    );


    // Растягиваем маску до размера фотографии

    const resizedMask =
      document.createElement("canvas");

    resizedMask.width =
      canvas.width;

    resizedMask.height =
      canvas.height;


    const resizedCtx =
      resizedMask.getContext("2d");

    resizedCtx.drawImage(
      maskCanvas,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const resizedMaskData =
      resizedCtx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      ).data;


    // Применяем прозрачность

    for (
      let i = 0;
      i < imageData.data.length;
      i += 4
    ) {

      imageData.data[i + 3] =
        resizedMaskData[i];

    }


    ctx.putImageData(
      imageData,
      0,
      0
    );


    // Показываем результат

    result.src =
      canvas.toDataURL("image/png");


    status.textContent =
      "✅ Готово! Фон удалён.";

  }

    console.error(error);

    status.textContent =
      "❌ Ошибка: " + error.message;

  }

  finally {

    removeBtn.disabled = false;

  }

});
