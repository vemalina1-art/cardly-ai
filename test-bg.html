```html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cardly AI — тест удаления фона</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
    }

    .box {
      max-width: 700px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 20px;
      text-align: center;
    }

    button {
      margin-top: 15px;
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #status {
      margin: 20px 0;
      color: #555;
      line-height: 1.5;
    }

    .checker {
      display: inline-block;
      margin-top: 20px;
      padding: 10px;

      background-image:
        linear-gradient(45deg, #ddd 25%, transparent 25%),
        linear-gradient(-45deg, #ddd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ddd 75%),
        linear-gradient(-45deg, transparent 75%, #ddd 75%);

      background-size: 20px 20px;
      background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;
    }

    #result {
      display: block;
      max-width: 100%;
      max-height: 600px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>✂️ Cardly AI</h1>

  <p>Тест автоматического удаления фона</p>

  <input
    id="imageInput"
    type="file"
    accept="image/*"
  >

  <br>

  <button id="removeBtn">
    ✂️ Убрать фон
  </button>

  <div id="status">
    Выбери фотографию товара
  </div>

  <div class="checker">
    <img id="result">
  </div>

</div>


<script type="module">

import {
  AutoModel,
  AutoProcessor,
  RawImage
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


const MODEL =
  "studioludens/birefnet-lite-512";


const imageInput =
  document.getElementById("imageInput");

const removeBtn =
  document.getElementById("removeBtn");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");


let selectedFile = null;

let model = null;

let processor = null;


// ------------------------------------
// Выбор фотографии
// ------------------------------------

imageInput.addEventListener(
  "change",
  (event) => {

    selectedFile =
      event.target.files[0];

    if (!selectedFile) {
      return;
    }

    result.src =
      URL.createObjectURL(selectedFile);

    status.textContent =
      "Фото выбрано. Нажми «Убрать фон».";

  }
);


// ------------------------------------
// Загрузка модели
// ------------------------------------

async function loadModel() {

  if (model && processor) {
    return;
  }

  status.textContent =
    "⏳ Загружаю AI-модель... Первый запуск может занять несколько минут.";

  try {

    // Сначала пробуем WebGPU

    try {

      status.textContent =
        "⚡ Запускаю AI через WebGPU...";

      model =
        await AutoModel.from_pretrained(
          MODEL,
          {
            dtype: "fp16",
            device: "webgpu"
          }
        );

    } catch (webgpuError) {

      console.warn(
        "WebGPU недоступен. Переключаюсь на WASM.",
        webgpuError
      );

      status.textContent =
        "💻 WebGPU недоступен. Запускаю более совместимый режим...";

      model =
        await AutoModel.from_pretrained(
          MODEL,
          {
            dtype: "fp32",
            device: "wasm"
          }
        );

    }


    processor =
      await AutoProcessor.from_pretrained(
        MODEL
      );

  } catch (error) {

    console.error(
      "MODEL LOAD ERROR:",
      error
    );

    throw new Error(
      "Не удалось загрузить AI-модель: " +
      error.message
    );

  }

}


// ------------------------------------
// Удаление фона
// ------------------------------------

removeBtn.addEventListener(
  "click",
  async () => {

    if (!selectedFile) {

      status.textContent =
        "Сначала выбери фотографию.";

      return;

    }


    try {

      removeBtn.disabled = true;


      await loadModel();


      status.textContent =
        "🔍 Анализирую фотографию...";


      // Загружаем изображение
      const imageURL =
        URL.createObjectURL(selectedFile);

      const image =
        await RawImage.read(imageURL);

      URL.revokeObjectURL(imageURL);


      // Подготавливаем изображение
      const {
        pixel_values
      } =
        await processor(image);


      status.textContent =
        "✂️ AI удаляет фон...";


      // Запускаем BiRefNet
      const {
        logits
      } =
        await model({
          input_image: pixel_values
        });


      // --------------------------------
      // Получаем маску
      // --------------------------------

      const mask =
        logits
          .sigmoid()
          .mul(255)
          .to("cpu");


      // --------------------------------
      // Canvas исходного изображения
      // --------------------------------

      const canvas =
        document.createElement("canvas");

      canvas.width =
        image.width;

      canvas.height =
        image.height;


      const ctx =
        canvas.getContext("2d");


      const imageData =
        await image.toImageData();


      // --------------------------------
      // Маска 512 × 512
      // превращается в ImageData
      // --------------------------------

      const maskCanvas =
        document.createElement("canvas");

      maskCanvas.width =
        mask.dims[1];

      maskCanvas.height =
        mask.dims[0];


      const maskCtx =
        maskCanvas.getContext("2d");


      const maskPixels =
        new Uint8ClampedArray(
          mask.data
        );


      const maskImageData =
        new ImageData(
          maskPixels,
          maskCanvas.width,
          maskCanvas.height
        );


      maskCtx.putImageData(
        maskImageData,
        0,
        0
      );


      // --------------------------------
      // Растягиваем маску
      // до размера фотографии
      // --------------------------------

      const resizedMask =
        document.createElement("canvas");

      resizedMask.width =
        image.width;

      resizedMask.height =
        image.height;


      const resizedMaskCtx =
        resizedMask.getContext("2d");


      resizedMaskCtx.drawImage(
        maskCanvas,
        0,
        0,
        image.width,
        image.height
      );


      const resizedMaskData =
        resizedMaskCtx.getImageData(
          0,
          0,
          image.width,
          image.height
        ).data;


      // --------------------------------
      // Добавляем прозрачность
      // --------------------------------

      for (
        let i = 0;
        i < imageData.data.length;
        i += 4
      ) {

        imageData.data[i + 3] =
          resizedMaskData[i];

      }


      ctx.putImageData(
        imageData,
        0,
        0
      );


      // --------------------------------
      // Показываем PNG
      // --------------------------------

      result.src =
        canvas.toDataURL(
          "image/png"
        );


      status.textContent =
        "✅ Готово! Фон удалён.";

    } catch (error) {

      console.error(
        "BACKGROUND REMOVAL ERROR:",
        error
      );

      status.textContent =
        "❌ Ошибка: " +
        error.message;

    } finally {

      removeBtn.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
