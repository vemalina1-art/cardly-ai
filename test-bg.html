<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardly AI — Тест удаления фона</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #172033;
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #64748b;
    margin-bottom: 25px;
}

.panel {
    background: white;
    padding: 22px;
    border-radius: 16px;
    margin-bottom: 22px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

button {
    padding: 13px 22px;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#status {
    margin-top: 16px;
    padding: 14px;
    background: #eff6ff;
    border-radius: 10px;
    white-space: pre-wrap;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.card {
    background: white;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.preview {
    min-height: 350px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 12px;
    background-color: #e5e7eb;
    background-image:
        linear-gradient(45deg,#ccc 25%,transparent 25%),
        linear-gradient(-45deg,#ccc 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#ccc 75%),
        linear-gradient(-45deg,transparent 75%,#ccc 75%);
    background-size: 30px 30px;
    background-position: 0 0,0 15px,15px -15px,-15px 0;
}

.preview img {
    max-width: 100%;
    max-height: 550px;
    object-fit: contain;
}

.dark {
    background: #111827;
}

.info {
    margin-top: 10px;
    color: #64748b;
    font-size: 13px;
    overflow-wrap: anywhere;
}

@media(max-width:850px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>Cardly AI — Background Removal</h1>
<div class="subtitle">Тест модели BiRefNet 512×512</div>

<div class="panel">

    <input type="file" id="fileInput" accept="image/*">

    <br><br>

    <button id="runBtn" disabled>
        Удалить фон
    </button>

    <div id="status">
        Подготавливаем загрузку модели...
    </div>

</div>

<div class="grid">

    <div class="card">
        <h3>1. Исходное изображение</h3>
        <div class="preview">
            <img id="originalPreview">
        </div>
        <div class="info" id="originalInfo"></div>
    </div>

    <div class="card">
        <h3>2. Маска объекта</h3>
        <div class="preview dark">
            <img id="maskPreview">
        </div>
        <div class="info">
            Светлое — объект, тёмное — фон.
        </div>
    </div>

    <div class="card">
        <h3>3. Результат</h3>
        <div class="preview">
            <img id="resultPreview">
        </div>
        <div class="info" id="resultInfo"></div>
    </div>

</div>

<script type="module">

import {
    AutoModel,
    AutoProcessor,
    RawImage,
    env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


/* ==========================================
   НАСТРОЙКИ МОДЕЛИ
========================================== */

const MODEL_ID = "onnx-community/BiRefNet_512x512-ONNX";

env.allowRemoteModels = true;

/*
   Важно: remoteHost — адрес нашего Worker.
   remotePathTemplate содержит {file}.
*/

env.remoteHost =
    window.location.origin + "/api/model/";

env.remotePathTemplate =
    "{model}/resolve/{revision}/{file}";

env.useBrowserCache = true;


/* ==========================================
   ЭЛЕМЕНТЫ СТРАНИЦЫ
========================================== */

const fileInput = document.getElementById("fileInput");
const runBtn = document.getElementById("runBtn");
const status = document.getElementById("status");

const originalPreview = document.getElementById("originalPreview");
const maskPreview = document.getElementById("maskPreview");
const resultPreview = document.getElementById("resultPreview");

const originalInfo = document.getElementById("originalInfo");
const resultInfo = document.getElementById("resultInfo");


/* ==========================================
   ПЕРЕМЕННЫЕ
========================================== */

let model = null;
let processor = null;
let selectedFile = null;
let originalImage = null;


/* ==========================================
   СТАТУС
========================================== */

function showStatus(message) {
    status.textContent = message;
    console.log(message);
}


/* ==========================================
   ЗАГРУЗКА МОДЕЛИ
========================================== */

async function loadModel() {

    try {

        showStatus(
            "Шаг 1/3: загружаем настройки BiRefNet...\n" +
            "Модель: " + MODEL_ID
        );

        processor = await AutoProcessor.from_pretrained(
            MODEL_ID
        );

        showStatus(
            "Шаг 2/3: настройки загружены.\n" +
            "Загружаем нейросеть..."
        );

        try {

            if (!navigator.gpu) {
                throw new Error("WebGPU недоступен");
            }

            const adapter = await navigator.gpu.requestAdapter();

            if (!adapter) {
                throw new Error("WebGPU adapter не найден");
            }

            model = await AutoModel.from_pretrained(
                MODEL_ID,
                {
                    dtype: "fp16",
                    device: "webgpu"
                }
            );

            showStatus(
                "Модель успешно загружена через WebGPU.\n" +
                "Теперь выбери изображение."
            );

        } catch (webgpuError) {

            console.warn("WebGPU:", webgpuError);

            showStatus(
                "WebGPU недоступен. Пробуем WASM..."
            );

            model = await AutoModel.from_pretrained(
                MODEL_ID,
                {
                    dtype: "q8",
                    device: "wasm"
                }
            );

            showStatus(
                "Модель успешно загружена через WASM.\n" +
                "Теперь выбери изображение."
            );
        }

        runBtn.disabled = false;

    } catch (error) {

        console.error("MODEL ERROR:", error);

        showStatus(
            "ОШИБКА ЗАГРУЗКИ МОДЕЛИ\n\n" +
            error.message
        );
    }
}


/* ==========================================
   ВЫБОР ФОТО
========================================== */

fileInput.addEventListener("change", async () => {

    const file = fileInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        showStatus("Выбери файл изображения.");
        return;
    }

    selectedFile = file;

    const imageUrl = URL.createObjectURL(file);

    originalPreview.src = imageUrl;

    originalInfo.textContent =
        file.name + " • " +
        (file.size / 1024 / 1024).toFixed(2) + " MB";

    maskPreview.removeAttribute("src");
    resultPreview.removeAttribute("src");

    try {

        originalImage = await RawImage.fromURL(imageUrl);

        showStatus(
            "Изображение загружено.\n" +
            "Нажми «Удалить фон»."
        );

    } catch (error) {

        console.error(error);

        showStatus(
            "Не удалось открыть изображение: " +
            error.message
        );
    }
});


/* ==========================================
   СОЗДАНИЕ ПРОЗРАЧНОГО PNG
========================================== */

runBtn.addEventListener("click", async () => {

    if (!selectedFile || !originalImage || !model || !processor) {
        showStatus("Сначала дождись загрузки модели и выбери фото.");
        return;
    }

    runBtn.disabled = true;

    try {

        showStatus("Подготавливаем изображение...");

        const { pixel_values } = await processor(originalImage);

        showStatus("BiRefNet анализирует изображение...");

        const output = await model({
            input_image: pixel_values
        });

        console.log("OUTPUT:", output);

        if (!output.output_image) {
            throw new Error("Модель не вернула output_image.");
        }

        const maskTensor = output.output_image[0]
            .sigmoid()
            .mul(255)
            .to("uint8");

        let mask = await RawImage.fromTensor(maskTensor);

        mask = await mask.resize(
            originalImage.width,
            originalImage.height
        );

        const maskCanvas = document.createElement("canvas");

        maskCanvas.width = mask.width;
        maskCanvas.height = mask.height;

        const maskCtx = maskCanvas.getContext("2d");

        const maskImageData = maskCtx.createImageData(
            mask.width,
            mask.height
        );

        const channels = mask.dims?.length === 3
            ? mask.dims[0]
            : 1;

        for (let i = 0; i < mask.width * mask.height; i++) {

            const value = mask.data[i * channels];

            const p = i * 4;

            maskImageData.data[p] = value;
            maskImageData.data[p + 1] = value;
            maskImageData.data[p + 2] = value;
            maskImageData.data[p + 3] = 255;
        }

        maskCtx.putImageData(maskImageData, 0, 0);

        maskPreview.src = maskCanvas.toDataURL("image/png");

        showStatus("Создаём PNG с прозрачным фоном...");

        const bitmap = await createImageBitmap(selectedFile);

        const resultCanvas = document.createElement("canvas");

        resultCanvas.width = bitmap.width;
        resultCanvas.height = bitmap.height;

        const resultCtx = resultCanvas.getContext("2d", {
            willReadFrequently: true
        });

        resultCtx.drawImage(bitmap, 0, 0);

        const originalPixels = resultCtx.getImageData(
            0,
            0,
            bitmap.width,
            bitmap.height
        );

        const maskPixels = maskCtx.getImageData(
            0,
            0,
            mask.width,
            mask.height
        );

        for (let i = 0; i < originalPixels.data.length; i += 4) {
            originalPixels.data[i + 3] = maskPixels.data[i];
        }

        resultCtx.putImageData(originalPixels, 0, 0);

        const resultBlob = await new Promise(resolve => {
            resultCanvas.toBlob(resolve, "image/png");
        });

        if (!resultBlob) {
            throw new Error("Не удалось создать PNG.");
        }

        const resultUrl = URL.createObjectURL(resultBlob);

        resultPreview.src = resultUrl;

        resultInfo.textContent =
            bitmap.width + " × " +
            bitmap.height + " px • PNG";

        showStatus(
            "Готово! Фон обработан.\n" +
            "Проверь качество маски на изображении."
        );

        const downloadLink = document.createElement("a");

        downloadLink.href = resultUrl;
        downloadLink.download = "cardly-background-removed.png";
        downloadLink.textContent = "Скачать PNG";

        resultInfo.appendChild(document.createElement("br"));
        resultInfo.appendChild(downloadLink);

    } catch (error) {

        console.error("REMOVAL ERROR:", error);

        showStatus(
            "ОШИБКА ОБРАБОТКИ\n\n" +
            error.message
        );

    } finally {

        runBtn.disabled = false;
    }

});


/* ==========================================
   ЗАПУСК
========================================== */

loadModel();

</script>

</body>
</html>
