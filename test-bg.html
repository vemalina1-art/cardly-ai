<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardly AI — Background Removal Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #111;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,.06);
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px 5px 5px 0;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        input[type="file"] {
            margin: 10px 0 15px;
        }

        #status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            background: #f1f3f5;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        #debug {
            margin-top: 15px;
            padding: 16px;
            border-radius: 12px;
            background: #111;
            color: #eee;
            white-space: pre-wrap;
            line-height: 1.45;
            font-family: Consolas, monospace;
            font-size: 12px;
            max-height: 500px;
            overflow: auto;
        }

        .images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .image-box {
            min-height: 350px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
        }

        .checker {
            background-color: #eee;
            background-image:
                linear-gradient(45deg, #ddd 25%, transparent 25%),
                linear-gradient(-45deg, #ddd 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ddd 75%),
                linear-gradient(-45deg, transparent 75%, #ddd 75%);
            background-size: 30px 30px;
            background-position:
                0 0,
                0 15px,
                15px -15px,
                -15px 0;
        }

        .image-box img {
            max-width: 100%;
            max-height: 600px;
            display: block;
        }

        .label {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(0,0,0,.75);
            color: white;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            .images {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cardly AI — Background Removal</h1>

    <div class="subtitle">
        Тест BiRefNet через Cloudflare Worker
    </div>


    <!-- ДИАГНОСТИКА -->

    <div class="panel">

        <button id="diagnosticButton">
            🔎 Проверить подключение
        </button>

        <button id="loadButton">
            🤖 Загрузить AI-модель
        </button>

        <div id="status">
            Готово к проверке.
        </div>

        <div id="debug">
            Отладочная информация появится здесь.
        </div>

    </div>


    <!-- ЗАГРУЗКА -->

    <div class="panel">

        <input
            id="fileInput"
            type="file"
            accept="image/*"
        >

        <br>

        <button
            id="removeButton"
            disabled
        >
            ✂️ Удалить фон
        </button>

    </div>


    <!-- РЕЗУЛЬТАТ -->

    <div class="panel">

        <div class="images">

            <div class="image-box">

                <div class="label">
                    Исходное изображение
                </div>

                <img
                    id="originalImage"
                    alt=""
                >

            </div>


            <div class="image-box checker">

                <div class="label">
                    Результат
                </div>

                <img
                    id="resultImage"
                    alt=""
                >

            </div>

        </div>

    </div>

</div>


<script type="module">

import {
    AutoModel,
    AutoProcessor,
    RawImage,
    env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


/* =========================================
   CLOUDFLARE PROXY
========================================= */

env.allowRemoteModels = true;

env.remoteHost =
    window.location.origin +
    "/api/model/";

env.remotePathTemplate =
    "{model}/resolve/{revision}";


/* =========================================
   ELEMENTS
========================================= */

const status =
    document.getElementById("status");

const debug =
    document.getElementById("debug");

const diagnosticButton =
    document.getElementById("diagnosticButton");

const loadButton =
    document.getElementById("loadButton");

const removeButton =
    document.getElementById("removeButton");

const fileInput =
    document.getElementById("fileInput");

const originalImage =
    document.getElementById("originalImage");

const resultImage =
    document.getElementById("resultImage");


/* =========================================
   VARIABLES
========================================= */

let model = null;
let processor = null;
let selectedFile = null;


/* =========================================
   STATUS
========================================= */

function setStatus(message) {
    status.textContent = message;
}

function setDebug(message) {
    debug.textContent = message;
}


/* =========================================
   FILE
========================================= */

fileInput.addEventListener("change", event => {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    selectedFile = file;

    originalImage.src =
        URL.createObjectURL(file);

    resultImage.src = "";

    setStatus(
        "✅ Изображение выбрано.\n\n" +
        "Теперь нажми «Загрузить AI-модель»."
    );

    setDebug(
        "Файл:\n" +
        file.name +
        "\n\nТип:\n" +
        file.type +
        "\n\nРазмер:\n" +
        (
            file.size / 1024 / 1024
        ).toFixed(2) +
        " MB"
    );

});


/* =========================================
   DIAGNOSTIC
========================================= */

diagnosticButton.addEventListener("click", async () => {

    diagnosticButton.disabled = true;

    let report = "";

    try {

        report += "1. Проверка WebGPU\n";

        if ("gpu" in navigator) {

            try {

                const adapter =
                    await navigator.gpu.requestAdapter();

                if (adapter) {

                    report +=
                        "✅ GPU adapter найден\n";

                    report +=
                        "GPU: " +
                        (
                            adapter.info?.device ||
                            adapter.info?.description ||
                            "unknown"
                        ) +
                        "\n\n";

                } else {

                    report +=
                        "⚠️ GPU adapter не найден\n\n";

                }

            } catch (error) {

                report +=
                    "⚠️ WebGPU ошибка: " +
                    error.message +
                    "\n\n";

            }

        } else {

            report +=
                "⚠️ WebGPU отсутствует\n\n";

        }


        report +=
            "2. Проверка Transformers.js\n";

        report +=
            "✅ Transformers.js загружен\n";

        report +=
            "AutoModel: " +
            !!AutoModel +
            "\n";

        report +=
            "AutoProcessor: " +
            !!AutoProcessor +
            "\n";

        report +=
            "RawImage: " +
            !!RawImage +
            "\n\n";


        report +=
            "3. Проверка Cloudflare Proxy\n";

        const configURL =
            window.location.origin +
            "/api/model/config.json";

        report +=
            "URL:\n" +
            configURL +
            "\n";

        const response =
            await fetch(configURL);

        if (!response.ok) {

            throw new Error(
                "Config HTTP " +
                response.status
            );

        }

        const config =
            await response.json();

        report +=
            "✅ config.json загружен\n";

        report +=
            "model_type: " +
            (
                config.model_type ||
                "unknown"
            ) +
            "\n\n";


        report +=
            "4. Проверка preprocessor\n";

        const preprocessorURL =
            window.location.origin +
            "/api/model/preprocessor_config.json";

        const preprocessorResponse =
            await fetch(preprocessorURL);

        if (!preprocessorResponse.ok) {

            throw new Error(
                "Preprocessor HTTP " +
                preprocessorResponse.status
            );

        }

        report +=
            "✅ preprocessor_config.json доступен\n\n";


        report +=
            "5. Проверка ONNX\n";

        const onnxURL =
            window.location.origin +
            "/api/model/onnx/model_fp16.onnx";

        const onnxResponse =
            await fetch(onnxURL);

        if (!onnxResponse.ok) {

            throw new Error(
                "ONNX HTTP " +
                onnxResponse.status
            );

        }

        report +=
            "✅ ONNX-файл доступен\n\n";


        report +=
            "================================\n" +
            "🎉 ПРОВЕРКА ПРОЙДЕНА\n" +
            "================================\n\n" +
            "Cloudflare Proxy работает.";

        setStatus(report);

    } catch (error) {

        setStatus(
            "❌ Ошибка диагностики.\n\n" +
            error.message
        );

        console.error(error);

    }

    diagnosticButton.disabled = false;

});


/* =========================================
   LOAD MODEL
========================================= */

loadButton.addEventListener("click", async () => {

    loadButton.disabled = true;

    try {

        setStatus(
            "⏳ Загружаю processor..."
        );

        processor =
            await AutoProcessor.from_pretrained(
                "studioludens/birefnet-lite-512"
            );


        setStatus(
            "✅ Processor загружен.\n\n" +
            "⏳ Загружаю BiRefNet..."
        );


        try {

            model =
                await AutoModel.from_pretrained(
                    "studioludens/birefnet-lite-512",
                    {
                        dtype: "fp16",
                        device: "webgpu"
                    }
                );

            setStatus(
                "🎉 BiRefNet загружен через WebGPU!"
            );

        } catch (webgpuError) {

            console.warn(
                "WebGPU error:",
                webgpuError
            );

            setStatus(
                "⚠️ WebGPU не запустился.\n\n" +
                "Пробую WASM..."
            );

            model =
                await AutoModel.from_pretrained(
                    "studioludens/birefnet-lite-512",
                    {
                        dtype: "q8",
                        device: "wasm"
                    }
                );

            setStatus(
                "🎉 BiRefNet загружен через WASM!"
            );

        }


        removeButton.disabled = false;

    } catch (error) {

        console.error(error);

        setStatus(
            "❌ Ошибка загрузки модели.\n\n" +
            "Тип: " +
            error.name +
            "\n\n" +
            error.message
        );

        loadButton.disabled = false;

    }

});


/* =========================================
   REMOVE BACKGROUND
========================================= */

removeButton.addEventListener("click", async () => {

    if (!model || !processor) {

        setStatus(
            "❌ Сначала загрузите модель."
        );

        return;

    }

    if (!selectedFile) {

        setStatus(
            "❌ Сначала выберите изображение."
        );

        return;

    }

    removeButton.disabled = true;

    try {

        /* ---------------------------------
           1. READ IMAGE
        --------------------------------- */

        setStatus(
            "⏳ Читаю изображение..."
        );

        const image =
            await RawImage.read(
                selectedFile
            );


        /* ---------------------------------
           2. PROCESS IMAGE
        --------------------------------- */

        setStatus(
            "⏳ Подготавливаю изображение..."
        );

        const processed =
            await processor(image);

        const pixel_values =
            processed.pixel_values;

        if (!pixel_values) {

            throw new Error(
                "Processor не вернул pixel_values."
            );

        }


        /* ---------------------------------
           3. RUN MODEL
        --------------------------------- */

        setStatus(
            "⏳ BiRefNet удаляет фон..."
        );

        const output =
            await model({
                input_image:
                    pixel_values
            });


        console.log(
            "========== MODEL OUTPUT =========="
        );

        console.log(output);


        /* ---------------------------------
           4. GET MASK
        --------------------------------- */

        const outputImage =
            output.output_image;

        if (!outputImage) {

            throw new Error(
                "Модель не вернула output_image."
            );

        }


        const dims =
            outputImage.dims;

        console.log(
            "OUTPUT DIMS:",
            dims
        );


        /*
         * Ожидаем:
         *
         * [1, 1, 512, 512]
         */

        if (
            !dims ||
            dims.length !== 4
        ) {

            throw new Error(
                "Неожиданная размерность output_image: " +
                JSON.stringify(dims)
            );

        }


        const batch =
            dims[0];

        const channels =
            dims[1];

        const maskWidth =
            dims[3];

        const maskHeight =
            dims[2];


        if (
            batch !== 1 ||
            channels !== 1
        ) {

            throw new Error(
                "Ожидался output [1,1,H,W], получено: " +
                JSON.stringify(dims)
            );

        }


        /* ---------------------------------
           5. GET RAW DATA
        --------------------------------- */

        const rawData =
            outputImage.data;

        if (!rawData) {

            throw new Error(
                "У output_image отсутствует data."
            );

        }


        console.log(
            "MASK DATA LENGTH:",
            rawData.length
        );


        /* ---------------------------------
           6. CREATE ALPHA MASK
        --------------------------------- */

        setStatus(
            "⏳ Создаю маску объекта..."
        );


        /*
         * Сначала применяем sigmoid
         * непосредственно к данным.
         *
         * sigmoid(x) =
         * 1 / (1 + e^(-x))
         */

        const alphaMask =
            new Float32Array(
                maskWidth * maskHeight
            );


        for (
            let i = 0;
            i < rawData.length;
            i++
        ) {

            const value =
                rawData[i];

            const sigmoid =
                1 /
                (
                    1 +
                    Math.exp(-value)
                );

            alphaMask[i] =
                sigmoid;

        }


        /* ---------------------------------
           7. ORIGINAL IMAGE CANVAS
        --------------------------------- */

        setStatus(
            "⏳ Создаю прозрачное изображение..."
        );


        const sourceCanvas =
            image.toCanvas();


        const sourceCtx =
            sourceCanvas.getContext(
                "2d"
            );


        if (!sourceCtx) {

            throw new Error(
                "Не удалось получить Canvas context."
            );

        }


        const sourceData =
            sourceCtx.getImageData(
                0,
                0,
                image.width,
                image.height
            );


        const pixels =
            sourceData.data;


        /* ---------------------------------
           8. SCALE MASK TO ORIGINAL SIZE
        --------------------------------- */

        /*
         * Маска 512×512.
         *
         * Исходное изображение может иметь
         * совершенно другой размер.
         *
         * Поэтому для каждого пикселя
         * исходной картинки определяем
         * соответствующий пиксель маски.
         */

        for (
            let y = 0;
            y < image.height;
            y++
        ) {

            const maskY =
                Math.min(
                    maskHeight - 1,
                    Math.floor(
                        y *
                        maskHeight /
                        image.height
                    )
                );


            for (
                let x = 0;
                x < image.width;
                x++
            ) {

                const maskX =
                    Math.min(
                        maskWidth - 1,
                        Math.floor(
                            x *
                            maskWidth /
                            image.width
                        )
                    );


                const maskIndex =
                    maskY *
                    maskWidth +
                    maskX;


                const pixelIndex =
                    (
                        y *
                        image.width +
                        x
                    ) *
                    4;


                let alpha =
                    alphaMask[maskIndex];


                /*
                 * Немного смягчаем
                 * края объекта.
                 */

                alpha =
                    Math.pow(
                        alpha,
                        0.8
                    );


                pixels[
                    pixelIndex + 3
                ] =
                    Math.round(
                        alpha * 255
                    );

            }

        }


        /* ---------------------------------
           9. PUT TRANSPARENT PIXELS
        --------------------------------- */

        sourceCtx.putImageData(
            sourceData,
            0,
            0
        );


        /* ---------------------------------
           10. EXPORT PNG
        --------------------------------- */

        const resultURL =
            sourceCanvas.toDataURL(
                "image/png"
            );


        resultImage.src =
            resultURL;


        /* ---------------------------------
           SUCCESS
        --------------------------------- */

        setStatus(
            "🎉 ГОТОВО!\n\n" +
            "Фон удалён.\n\n" +
            "BiRefNet успешно обработал изображение."
        );


        setDebug(
            "================================\n" +
            "✅ УСПЕШНО\n" +
            "================================\n\n" +

            "Выход модели:\n" +
            JSON.stringify(dims) +
            "\n\n" +

            "Тип данных:\n" +
            outputImage.type +
            "\n\n" +

            "Количество значений:\n" +
            rawData.length +
            "\n\n" +

            "Размер исходного изображения:\n" +
            image.width +
            " × " +
            image.height +
            "\n\n" +

            "Размер маски:\n" +
            maskWidth +
            " × " +
            maskHeight
        );


    } catch (error) {

        console.error(
            "BACKGROUND REMOVAL ERROR:",
            error
        );

        setStatus(
            "❌ Ошибка удаления фона.\n\n" +
            "Тип: " +
            error.name +
            "\n\n" +
            "Сообщение:\n" +
            error.message
        );


        setDebug(
            "================================\n" +
            "❌ ERROR\n" +
            "================================\n\n" +

            "Тип:\n" +
            error.name +
            "\n\n" +

            "Сообщение:\n" +
            error.message
        );

    }

    removeButton.disabled = false;

});


</script>

</body>
</html>
