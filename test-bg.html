<h1>🔬 BiRefNet Diagnostic</h1>

<input type="file" id="file" accept="image/*">

<br>

<button id="load">
    🤖 Загрузить AI-модель
</button>

<button id="run" disabled>
    🔎 Проверить все варианты маски
</button>

<div id="status">
Модель ещё не загружена.
</div>

<div class="images">

    <div class="box">
        <h3>Исходное изображение</h3>
        <img id="original">

    <div class="box">
        <h3>Вариант A — sigmoid</h3>
        <img id="maskA">
    </div>

    <div class="box">
        <h3>Вариант B — min/max normalize</h3>
        <img id="maskB">
    </div>

    <div class="box">
        <h3>Вариант C — inverted</h3>
        <img id="maskC">
    </div>

    <div class="box">
        <h3>Вариант D — normalized inverted</h3>
        <img id="maskD">
    </div>

    <div class="box">
        <h3>Вариант E — contrast</h3>
        <img id="maskE">

</div>

<pre id="debug"></pre>


<script type="module">

import {
    AutoModel,
    AutoProcessor,
    RawImage,
    env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


// ======================================================
// CONFIG
// ======================================================

env.allowRemoteModels = true;

env.remoteHost =
    window.location.origin + "/api/model/";

env.remotePathTemplate =
    "{model}/resolve/{revision}";


// ======================================================
// ELEMENTS
// ======================================================

const fileInput =
    document.getElementById("file");

const loadButton =
    document.getElementById("load");

const runButton =
    document.getElementById("run");

const status =
    document.getElementById("status");

const debug =
    document.getElementById("debug");

const originalImage =
    document.getElementById("original");


// ======================================================
// VARIABLES
// ======================================================

let model = null;
let processor = null;
let selectedFile = null;


// ======================================================
// FILE
// ======================================================

fileInput.addEventListener("change", () => {

    selectedFile = fileInput.files[0];

    if (!selectedFile) {
        return;
    }

    originalImage.src =
        URL.createObjectURL(selectedFile);

    status.textContent =
        "📷 Изображение загружено.\nТеперь загрузи AI-модель.";

});


// ======================================================
// LOAD MODEL
// ======================================================

loadButton.addEventListener("click", async () => {

    try {

        status.textContent =
            "⏳ Загружаем процессор...";

        processor =
            await AutoProcessor.from_pretrained(
                "studioludens/birefnet-lite-512"
            );


        status.textContent =
            "⏳ Загружаем модель...\nЭто может занять некоторое время.";

        try {

            model =
                await AutoModel.from_pretrained(
                    "studioludens/birefnet-lite-512",
                    {
                        dtype: "fp16",
                        device: "webgpu"
                    }
                );

            status.textContent =
                "🚀 BiRefNet работает через WebGPU.";

        } catch (webgpuError) {

            console.warn(
                "WebGPU error:",
                webgpuError
            );

            status.textContent =
                "⚠️ WebGPU не сработал.\nПробуем WASM...";

            model =
                await AutoModel.from_pretrained(
                    "studioludens/birefnet-lite-512",
                    {
                        device: "wasm"
                    }
                );

            status.textContent =
                "🟢 BiRefNet работает через WASM.";
        }


        runButton.disabled = false;

        status.textContent +=
            "\n\n✅ Модель полностью загружена.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Ошибка загрузки модели:\n\n" +
            error.message;

    }

});


// ======================================================
// CREATE IMAGE FROM MASK
// ======================================================

function maskToDataURL(
    values,
    width,
    height,
    mode
) {

    const canvas =
        document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const ctx =
        canvas.getContext("2d");

    const imageData =
        ctx.createImageData(
            width,
            height
        );

    let min = Infinity;
    let max = -Infinity;

    for (let i = 0; i < values.length; i++) {

        if (values[i] < min)
            min = values[i];

        if (values[i] > max)
            max = values[i];

    }


    const range =
        max - min || 1;


    for (
        let i = 0;
        i < values.length;
        i++
    ) {

        const raw =
            values[i];

        let value = 0;


        // ----------------------------------------------
        // A
        // обычный sigmoid
        // ----------------------------------------------

        if (mode === "sigmoid") {

            value =
                1 /
                (
                    1 +
                    Math.exp(-raw)
                );

        }


        // ----------------------------------------------
        // B
        // нормализация min/max
        // ----------------------------------------------

        else if (mode === "normalize") {

            value =
                (raw - min) /
                range;

        }


        // ----------------------------------------------
        // C
        // sigmoid inverted
        // ----------------------------------------------

        else if (mode === "inverse") {

            const sigmoid =
                1 /
                (
                    1 +
                    Math.exp(-raw)
                );

            value =
                1 - sigmoid;

        }


        // ----------------------------------------------
        // D
        // normalized inverted
        // ----------------------------------------------

        else if (mode === "normalizeInverse") {

            value =
                1 -
                (
                    (raw - min) /
                    range
                );

        }


        // ----------------------------------------------
        // E
        // normalized + contrast
        // ----------------------------------------------

        else if (mode === "contrast") {

            let normalized =
                (raw - min) /
                range;


            // усиливаем контраст

            normalized =
                Math.pow(
                    normalized,
                    0.35
                );

            value =
                normalized;

        }


        value =
            Math.max(
                0,
                Math.min(
                    1,
                    value
                )
            );


        const gray =
            Math.round(
                value * 255
            );


        const index =
            i * 4;


        imageData.data[index] =
            gray;

        imageData.data[index + 1] =
            gray;

        imageData.data[index + 2] =
            gray;

        imageData.data[index + 3] =
            255;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas.toDataURL(
        "image/png"
    );

}


// ======================================================
// RUN
// ======================================================

runButton.addEventListener("click", async () => {

    if (!selectedFile) {

        alert(
            "Сначала выбери изображение."
        );

        return;
    }


    if (!model || !processor) {

        alert(
            "Сначала загрузи модель."
        );

        return;
    }


    try {

        status.textContent =
            "⏳ Читаем изображение...";


        const image =
            await RawImage.read(
                selectedFile
            );


        status.textContent =
            "⏳ Подготавливаем изображение...";


        const {
            pixel_values
        } =
            await processor(
                image
            );


        status.textContent =
            "🧠 BiRefNet анализирует изображение...";


        const output =
            await model({
                input_image:
                    pixel_values
            });


        console.log(
            "FULL MODEL OUTPUT:",
            output
        );


        const outputImage =
            output.output_image;


        if (!outputImage) {

            throw new Error(
                "output.output_image отсутствует"
            );

        }


        console.log(
            "OUTPUT IMAGE:",
            outputImage
        );


        const dims =
            outputImage.dims;


        console.log(
            "DIMS:",
            dims
        );


        const tensor =
            outputImage.ort_tensor;


        if (!tensor) {

            throw new Error(
                "ort_tensor отсутствует"
            );

        }


        const rawData =
            tensor.data;


        console.log(
            "RAW DATA:",
            rawData
        );


        // ==================================================
        // DIMS
        // ==================================================

        let width = 512;
        let height = 512;


        if (
            dims &&
            dims.length >= 2
        ) {

            height =
                dims[dims.length - 2];

            width =
                dims[dims.length - 1];

        }


        // ==================================================
        // STATISTICS
        // ==================================================

        let min =
            Infinity;

        let max =
            -Infinity;

        let sum =
            0;


        for (
            let i = 0;
            i < rawData.length;
            i++
        ) {

            const value =
                rawData[i];

            if (value < min)
                min = value;

            if (value > max)
                max = value;

            sum += value;

        }


        const average =
            sum /
            rawData.length;


        const sigmoid =
            x =>
                1 /
                (
                    1 +
                    Math.exp(-x)
                );


        const sigmoidMin =
            sigmoid(min);

        const sigmoidMax =
            sigmoid(max);

        const sigmoidAverage =
            sigmoid(average);


        // ==================================================
        // DEBUG TEXT
        // ==================================================

        debug.textContent =
`
========================================
BIREFNET DEEP DIAGNOSTIC
========================================

Model output:
${JSON.stringify(dims)}

Width:
${width}

Height:
${height}

Raw values:
${rawData.length}

----------------------------------------
RAW
----------------------------------------

Minimum:
${min}

Maximum:
${max}

Average:
${average}

----------------------------------------
SIGMOID
----------------------------------------

Sigmoid minimum:
${sigmoidMin}

Sigmoid maximum:
${sigmoidMax}

Sigmoid average:
${sigmoidAverage}

----------------------------------------
FIRST 20 VALUES
----------------------------------------

${Array.from(rawData.slice(0, 20)).join("\n")}

========================================
FULL OUTPUT OBJECT
========================================

Открой F12 → Console
и посмотри объект:
FULL MODEL OUTPUT

========================================
`;


        // ==================================================
        // CREATE ALL MASKS
        // ==================================================

        document.getElementById("maskA").src =
            maskToDataURL(
                rawData,
                width,
                height,
                "sigmoid"
            );


        document.getElementById("maskB").src =
            maskToDataURL(
                rawData,
                width,
                height,
                "normalize"
            );


        document.getElementById("maskC").src =
            maskToDataURL(
                rawData,
                width,
                height,
                "inverse"
            );


        document.getElementById("maskD").src =
            maskToDataURL(
                rawData,
                width,
                height,
                "normalizeInverse"
            );


        document.getElementById("maskE").src =
            maskToDataURL(
                rawData,
                width,
                height,
                "contrast"
            );


        status.innerHTML =
`
<span class="good">
✅ Диагностика завершена.
</span>

Мы получили сразу 5 вариантов обработки
одного и того же выхода модели.

Сейчас главное — посмотреть,
в каком из пяти вариантов товар становится белым,
а фон чёрным.
`;


    } catch (error) {

        console.error(
            error
        );

        status.innerHTML =
`
<span class="bad">
❌ Ошибка
</span>

${error.message}
`;

        debug.textContent =
            error.stack ||
            error.toString();

    }

});

</script>

</body>
</html>
