```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BiRefNet Test</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    h1 {
        margin-top: 0;
    }

    button {
        padding: 14px 20px;
        margin: 8px 5px 8px 0;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
    }

    #load {
        background: #444;
        color: white;
    }

    #run {
        background: #2563eb;
        color: white;
    }

    #run:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    #status {
        margin-top: 15px;
        padding: 15px;
        background: #1d1d1d;
        border-radius: 8px;
        white-space: pre-wrap;
    }

    .images {
        display: grid;
        grid-template-columns: repeat(2, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 25px;
        max-width: 900px;
    }

    .box {
        background: #1c1c1c;
        padding: 12px;
        border-radius: 12px;
    }

    .box h3 {
        margin: 0 0 10px;
    }

    img {
        display: block;
        width: 100%;
        min-height: 200px;
        object-fit: contain;
        background:
            linear-gradient(45deg, #777 25%, transparent 25%),
            linear-gradient(-45deg, #777 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #777 75%),
            linear-gradient(-45deg, transparent 75%, #777 75%);
        background-size: 20px 20px;
        background-position:
            0 0,
            0 10px,
            10px -10px,
            -10px 0;
    }

    pre {
        margin-top: 25px;
        padding: 15px;
        background: #050505;
        border-radius: 8px;
        white-space: pre-wrap;
        overflow-x: auto;
    }

    .ok {
        color: #4ade80;
    }

    .error {
        color: #f87171;
    }
</style>
</head>

<body>

<h1>🔬 BiRefNet — правильный output</h1>

<input
    type="file"
    id="file"
    accept="image/*"
>

<br>

<button id="load">
    🤖 Загрузить AI-модель
</button>

<button id="run" disabled>
    ✂️ Проверить маску
</button>

<div id="status">
Модель ещё не загружена.
</div>

<div class="images">

    <div class="box">
        <h3>Исходное изображение</h3>
        <img id="original">
    </div>

    <div class="box">
        <h3>Маска BiRefNet</h3>
        <img id="mask">
    </div>

</div>

<pre id="debug"></pre>


<script type="module">

import {
    AutoModel,
    AutoProcessor,
    RawImage,
    env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


// ======================================================
// HUGGING FACE PROXY
// ======================================================

env.allowRemoteModels = true;

env.remoteHost =
    window.location.origin + "/api/model/";

env.remotePathTemplate =
    "{model}/resolve/{revision}";


// ======================================================
// ELEMENTS
// ======================================================

const fileInput =
    document.getElementById("file");

const loadButton =
    document.getElementById("load");

const runButton =
    document.getElementById("run");

const status =
    document.getElementById("status");

const debug =
    document.getElementById("debug");

const original =
    document.getElementById("original");

const maskImage =
    document.getElementById("mask");


// ======================================================
// VARIABLES
// ======================================================

let selectedFile = null;

let model = null;

let processor = null;


// ======================================================
// SELECT IMAGE
// ======================================================

fileInput.addEventListener(
    "change",
    () => {

        selectedFile =
            fileInput.files[0];

        if (!selectedFile) {
            return;
        }

        original.src =
            URL.createObjectURL(
                selectedFile
            );

        status.textContent =
            "📷 Фото загружено.\n\n" +
            "Теперь нажми «Загрузить AI-модель».";

    }
);


// ======================================================
// LOAD MODEL
// ======================================================

loadButton.addEventListener(
    "click",
    async () => {

        try {

            loadButton.disabled = true;

            status.textContent =
                "⏳ Загружаем процессор BiRefNet...";


            processor =
                await AutoProcessor.from_pretrained(
                    "studioludens/birefnet-lite-512"
                );


            status.textContent =
                "⏳ Загружаем модель BiRefNet...\n\n" +
                "Если используется WebGPU, загрузка может занять некоторое время.";


            try {

                model =
                    await AutoModel.from_pretrained(
                        "studioludens/birefnet-lite-512",
                        {
                            dtype: "fp16",
                            device: "webgpu"
                        }
                    );

                status.textContent =
                    "🚀 Модель загружена через WebGPU.";

            } catch (webgpuError) {

                console.warn(
                    "WebGPU error:",
                    webgpuError
                );

                status.textContent =
                    "⚠️ WebGPU не запустился.\n" +
                    "Переходим на WASM...";


                model =
                    await AutoModel.from_pretrained(
                        "studioludens/birefnet-lite-512",
                        {
                            device: "wasm"
                        }
                    );


                status.textContent =
                    "🟢 Модель загружена через WASM.";

            }


            runButton.disabled = false;


            status.textContent +=
                "\n\n✅ BiRefNet полностью готов.";

        } catch (error) {

            console.error(
                error
            );

            status.innerHTML =
                '<span class="error">' +
                "❌ Ошибка загрузки модели\n\n" +
                error.message +
                "</span>";

            loadButton.disabled = false;

        }

    }
);


// ======================================================
// CREATE MASK IMAGE
// ======================================================

async function createMaskImage(
    logits,
    originalWidth,
    originalHeight
) {

    /*
        Здесь используем именно официальный
        подход модели:

        logits
        ↓
        sigmoid
        ↓
        ×255
        ↓
        RawImage
        ↓
        resize
    */


    console.log(
        "LOGITS OBJECT:",
        logits
    );


    // --------------------------------------------------
    // Убираем batch dimension
    // --------------------------------------------------

    let maskTensor;


    try {

        /*
            Ожидаем:

            logits:
            [1, 1, 512, 512]

            logits[0]:
            [1, 512, 512]
        */

        maskTensor =
            logits[0];

    } catch (error) {

        console.warn(
            "Не удалось взять logits[0]",
            error
        );

        maskTensor =
            logits;

    }


    console.log(
        "MASK TENSOR:",
        maskTensor
    );


    // --------------------------------------------------
    // SIGMOID
    // --------------------------------------------------

    const sigmoidMask =
        maskTensor
            .sigmoid()
            .mul(255);


    console.log(
        "SIGMOID MASK:",
        sigmoidMask
    );


    // --------------------------------------------------
    // RawImage
    // --------------------------------------------------

    const mask =
        await RawImage.fromTensor(
            sigmoidMask
        );


    console.log(
        "MASK RAW IMAGE:",
        mask
    );


    // --------------------------------------------------
    // RESIZE
    // --------------------------------------------------

    const resized =
        mask.resize(
            originalWidth,
            originalHeight
        );


    return resized.toDataURL();

}


// ======================================================
// RUN MODEL
// ======================================================

runButton.addEventListener(
    "click",
    async () => {

        if (!selectedFile) {

            alert(
                "Сначала выбери фотографию."
            );

            return;
        }


        if (!model || !processor) {

            alert(
                "Сначала загрузи модель."
            );

            return;
        }


        try {

            runButton.disabled = true;


            status.textContent =
                "⏳ Читаем изображение...";


            const image =
                await RawImage.read(
                    selectedFile
                );


            console.log(
                "ORIGINAL IMAGE:",
                image
            );


            status.textContent =
                "⏳ Подготавливаем изображение для BiRefNet...";


            const {
                pixel_values
            } =
                await processor(
                    image
                );


            console.log(
                "PIXEL VALUES:",
                pixel_values
            );


            status.textContent =
                "🧠 BiRefNet анализирует товар...";


            /*
                ВАЖНО:

                Берём именно logits.

                Это официальный output
                модели BiRefNet.
            */

            const output =
                await model({
                    input_image:
                        pixel_values
                });


            console.log(
                "================================"
            );

            console.log(
                "FULL MODEL OUTPUT:",
                output
            );

            console.log(
                "OUTPUT KEYS:",
                Object.keys(output)
            );

            console.log(
                "LOGITS:",
                output.logits
            );

            console.log(
                "LOGITS DIMS:",
                output.logits?.dims
            );

            console.log(
                "================================"
            );


            // ------------------------------------------------
            // CHECK LOGITS
            // ------------------------------------------------

            if (!output.logits) {

                throw new Error(
                    "BiRefNet не вернул output.logits"
                );

            }


            const logits =
                output.logits;


            // ------------------------------------------------
            // DEBUG
            // ------------------------------------------------

            let rawData = null;


            if (
                logits &&
                logits.ort_tensor &&
                logits.ort_tensor.data
            ) {

                rawData =
                    logits.ort_tensor.data;

            }


            let min =
                Infinity;

            let max =
                -Infinity;

            let sum =
                0;


            if (rawData) {

                for (
                    let i = 0;
                    i < rawData.length;
                    i++
                ) {

                    const value =
                        rawData[i];


                    if (value < min)
                        min = value;


                    if (value > max)
                        max = value;


                    sum += value;

                }

            }


            const average =
                rawData
                    ? sum / rawData.length
                    : NaN;


            const sigmoid =
                x =>
                    1 /
                    (
                        1 +
                        Math.exp(-x)
                    );


            const sigMin =
                sigmoid(min);

            const sigMax =
                sigmoid(max);

            const sigAverage =
                sigmoid(average);


            debug.textContent =
`
========================================
BIREFNET CORRECT OUTPUT DEBUG
========================================

Output keys:
${Object.keys(output).join(", ")}

----------------------------------------
LOGITS
----------------------------------------

Dims:
${JSON.stringify(logits.dims)}

Raw values:
${rawData ? rawData.length : "not available"}

Minimum:
${min}

Maximum:
${max}

Average:
${average}

----------------------------------------
SIGMOID
----------------------------------------

Minimum:
${sigMin}

Maximum:
${sigMax}

Average:
${sigAverage}

----------------------------------------
IMPORTANT
----------------------------------------

Теперь используется:

output.logits

а НЕ:

output.output_image

Это соответствует документации
studioludens/birefnet-lite-512.

========================================
`;


            // ------------------------------------------------
            // CREATE MASK
            // ------------------------------------------------

            status.textContent =
                "🎨 Создаём маску...";


            const maskURL =
                await createMaskImage(
                    logits,
                    image.width,
                    image.height
                );


            maskImage.src =
                maskURL;


            status.innerHTML =
                '<span class="ok">' +
                "🎉 МАСКА ГОТОВА!" +
                "</span>" +
                "\n\n" +
                "Теперь посмотри на изображение справа.";


            runButton.disabled = false;


        } catch (error) {

            console.error(
                "BIREFNET ERROR:",
                error
            );


            status.innerHTML =
                '<span class="error">' +
                "❌ ОШИБКА\n\n" +
                error.message +
                "</span>";


            debug.textContent =
                error.stack ||
                error.toString();


            runButton.disabled = false;

        }

    }
);

</script>

</body>
</html>
```
