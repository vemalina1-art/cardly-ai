<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardly AI — Mask Diagnostic</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #111;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,.06);
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px 5px 5px 0;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        input[type="file"] {
            margin: 10px 0 15px;
        }

        #status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            background: #f1f3f5;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
        }

        #debug {
            margin-top: 15px;
            padding: 16px;
            border-radius: 12px;
            background: #111;
            color: #eee;
            white-space: pre-wrap;
            line-height: 1.45;
            font-family: Consolas, monospace;
            font-size: 12px;
            max-height: 500px;
            overflow: auto;
        }

        .images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .image-box {
            min-height: 350px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
        }

        .checker {
            background-color: #eee;
            background-image:
                linear-gradient(45deg, #ddd 25%, transparent 25%),
                linear-gradient(-45deg, #ddd 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ddd 75%),
                linear-gradient(-45deg, transparent 75%, #ddd 75%);
            background-size: 30px 30px;
            background-position:
                0 0,
                0 15px,
                15px -15px,
                -15px 0;
        }

        .image-box img {
            max-width: 100%;
            max-height: 600px;
            display: block;
        }

        .label {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(0,0,0,.75);
            color: white;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            .images {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cardly AI — BiRefNet Mask Diagnostic</h1>

    <div class="subtitle">
        Проверяем качество маски удаления фона
    </div>


    <!-- =====================================
         MODEL
    ====================================== -->

    <div class="panel">

        <button id="diagnosticButton">
            🔎 Проверить подключение
        </button>

        <button id="loadButton">
            🤖 Загрузить AI-модель
        </button>

        <div id="status">
            Готово к проверке.
        </div>

        <div id="debug">
            Отладочная информация появится здесь.
        </div>

    </div>


    <!-- =====================================
         FILE
    ====================================== -->

    <div class="panel">

        <input
            id="fileInput"
            type="file"
            accept="image/*"
        >

        <br>

        <button id="removeButton" disabled>
            ✂️ Проверить маску
        </button>

    </div>


    <!-- =====================================
         IMAGES
    ====================================== -->

    <div class="panel">

        <div class="images">

            <div class="image-box">

                <div class="label">
                    Исходное изображение
                </div>

                <img
                    id="originalImage"
                    alt=""
                >

            </div>


            <div class="image-box">

                <div class="label">
                    Маска BiRefNet
                </div>

                <img
                    id="resultImage"
                    alt=""
                >

            </div>

        </div>

    </div>

</div>


<script type="module">


/* =========================================
   TRANSFORMERS.JS
========================================= */

import {
    AutoModel,
    AutoProcessor,
    RawImage,
    env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


/* =========================================
   CLOUDFLARE PROXY
========================================= */

env.allowRemoteModels = true;

env.remoteHost =
    window.location.origin + "/api/model/";

env.remotePathTemplate =
    "{model}/resolve/{revision}";


/* =========================================
   ELEMENTS
========================================= */

const status =
    document.getElementById("status");

const debug =
    document.getElementById("debug");

const diagnosticButton =
    document.getElementById("diagnosticButton");

const loadButton =
    document.getElementById("loadButton");

const removeButton =
    document.getElementById("removeButton");

const fileInput =
    document.getElementById("fileInput");

const originalImage =
    document.getElementById("originalImage");

const resultImage =
    document.getElementById("resultImage");


/* =========================================
   VARIABLES
========================================= */

let model = null;
let processor = null;
let selectedFile = null;


/* =========================================
   HELPERS
========================================= */

function setStatus(text) {
    status.textContent = text;
}

function setDebug(text) {
    debug.textContent = text;
}


/* =========================================
   FILE SELECT
========================================= */

fileInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        selectedFile = file;

        originalImage.src =
            URL.createObjectURL(file);

        resultImage.src = "";

        setStatus(
            "✅ Фото выбрано.\n\n" +
            "Теперь загрузи модель."
        );

        setDebug(
            "Файл:\n" +
            file.name +
            "\n\n" +

            "Тип:\n" +
            file.type +
            "\n\n" +

            "Размер:\n" +
            (file.size / 1024 / 1024)
                .toFixed(2) +
            " MB"
        );

    }
);


/* =========================================
   DIAGNOSTIC
========================================= */

diagnosticButton.addEventListener(
    "click",
    async () => {

        diagnosticButton.disabled = true;

        try {

            let report = "";


            /* WEBGPU */

            report +=
                "1. Проверка WebGPU\n\n";

            if ("gpu" in navigator) {

                const adapter =
                    await navigator.gpu
                        .requestAdapter();

                if (adapter) {

                    report +=
                        "✅ GPU adapter найден\n\n";

                } else {

                    report +=
                        "⚠️ GPU adapter не найден\n\n";

                }

            } else {

                report +=
                    "⚠️ WebGPU отсутствует\n\n";

            }


            /* TRANSFORMERS */

            report +=
                "2. Transformers.js\n\n";

            report +=
                "AutoModel: " +
                !!AutoModel +
                "\n";

            report +=
                "AutoProcessor: " +
                !!AutoProcessor +
                "\n";

            report +=
                "RawImage: " +
                !!RawImage +
                "\n\n";


            /* CONFIG */

            report +=
                "3. Cloudflare Proxy\n\n";

            const configURL =
                window.location.origin +
                "/api/model/config.json";

            const response =
                await fetch(configURL);

            if (!response.ok) {

                throw new Error(
                    "Config HTTP " +
                    response.status
                );

            }

            const config =
                await response.json();

            report +=
                "✅ config.json работает\n";

            report +=
                "model_type: " +
                (
                    config.model_type ||
                    "unknown"
                ) +
                "\n\n";


            /* ONNX */

            report +=
                "4. ONNX\n\n";

            const onnxURL =
                window.location.origin +
                "/api/model/onnx/model_fp16.onnx";

            const onnxResponse =
                await fetch(onnxURL);

            if (!onnxResponse.ok) {

                throw new Error(
                    "ONNX HTTP " +
                    onnxResponse.status
                );

            }

            report +=
                "✅ ONNX доступен\n\n";


            report +=
                "================================\n" +
                "🎉 ПРОВЕРКА ПРОЙДЕНА\n" +
                "================================";


            setStatus(report);

        } catch (error) {

            console.error(error);

            setStatus(
                "❌ Ошибка диагностики:\n\n" +
                error.message
            );

        }


        diagnosticButton.disabled = false;

    }
);


/* =========================================
   LOAD MODEL
========================================= */

loadButton.addEventListener(
    "click",
    async () => {

        loadButton.disabled = true;

        try {

            /* PROCESSOR */

            setStatus(
                "⏳ Загружаю processor..."
            );

            processor =
                await AutoProcessor
                    .from_pretrained(
                        "studioludens/birefnet-lite-512"
                    );


            setStatus(
                "✅ Processor загружен.\n\n" +
                "⏳ Загружаю BiRefNet..."
            );


            /* WEBGPU */

            try {

                model =
                    await AutoModel
                        .from_pretrained(
                            "studioludens/birefnet-lite-512",
                            {
                                dtype: "fp16",
                                device: "webgpu"
                            }
                        );


                setStatus(
                    "🎉 BiRefNet загружен через WebGPU!"
                );


            } catch (webgpuError) {

                console.warn(
                    "WebGPU ошибка:",
                    webgpuError
                );


                setStatus(
                    "⚠️ WebGPU не запустился.\n\n" +
                    "Пробую WASM..."
                );


                /* WASM */

                model =
                    await AutoModel
                        .from_pretrained(
                            "studioludens/birefnet-lite-512",
                            {
                                dtype: "q8",
                                device: "wasm"
                            }
                        );


                setStatus(
                    "🎉 BiRefNet загружен через WASM!"
                );

            }


            removeButton.disabled =
                false;


        } catch (error) {

            console.error(error);

            setStatus(
                "❌ Ошибка загрузки модели.\n\n" +
                "Тип: " +
                error.name +
                "\n\n" +
                error.message
            );

            loadButton.disabled = false;

        }

    }
);


/* =========================================
   CREATE MASK
========================================= */

removeButton.addEventListener(
    "click",
    async () => {

        if (!model || !processor) {

            setStatus(
                "❌ Сначала загрузи модель."
            );

            return;

        }


        if (!selectedFile) {

            setStatus(
                "❌ Сначала выбери изображение."
            );

            return;

        }


        removeButton.disabled = true;


        try {

            /* =================================
               1. READ IMAGE
            ================================= */

            setStatus(
                "⏳ Читаю изображение..."
            );

            const image =
                await RawImage.read(
                    selectedFile
                );


            /* =================================
               2. PROCESS
            ================================= */

            setStatus(
                "⏳ Подготавливаю изображение..."
            );

            const processed =
                await processor(image);


            const pixel_values =
                processed.pixel_values;


            /* =================================
               3. MODEL
            ================================= */

            setStatus(
                "⏳ BiRefNet анализирует товар..."
            );


            const output =
                await model({
                    input_image:
                        pixel_values
                });


            /* =================================
               4. OUTPUT
            ================================= */

            const outputImage =
                output.output_image;


            if (!outputImage) {

                throw new Error(
                    "output_image отсутствует."
                );

            }


            const dims =
                outputImage.dims;


            console.log(
                "MODEL OUTPUT:",
                outputImage
            );

            console.log(
                "DIMS:",
                dims
            );


            if (
                !dims ||
                dims.length !== 4
            ) {

                throw new Error(
                    "Неожиданная размерность: " +
                    JSON.stringify(dims)
                );

            }


            const maskHeight =
                dims[2];

            const maskWidth =
                dims[3];


            /* =================================
               5. RAW DATA
            ================================= */

            const ortTensor =
                outputImage.ort_tensor;


            if (!ortTensor) {

                throw new Error(
                    "ort_tensor отсутствует."
                );

            }


            const rawData =
                ortTensor.data;


            if (!rawData) {

                throw new Error(
                    "ort_tensor.data отсутствует."
                );

            }


            /* =================================
               6. SIGMOID
            ================================= */

            const alphaMask =
                new Float32Array(
                    maskWidth *
                    maskHeight
                );


            let minValue =
                Infinity;

            let maxValue =
                -Infinity;

            let sumValue =
                0;


            for (
                let i = 0;
                i < alphaMask.length;
                i++
            ) {

                const value =
                    Number(rawData[i]);


                minValue =
                    Math.min(
                        minValue,
                        value
                    );


                maxValue =
                    Math.max(
                        maxValue,
                        value
                    );


                const sigmoid =
                    1 /
                    (
                        1 +
                        Math.exp(-value)
                    );


                alphaMask[i] =
                    sigmoid;


                sumValue +=
                    sigmoid;

            }


            const average =
                sumValue /
                alphaMask.length;


            /* =================================
               7. CREATE MASK CANVAS
            ================================= */

            setStatus(
                "⏳ Строю маску..."
            );


            const maskCanvas =
                document.createElement(
                    "canvas"
                );


            maskCanvas.width =
                maskWidth;

            maskCanvas.height =
                maskHeight;


            const maskCtx =
                maskCanvas.getContext(
                    "2d"
                );


            if (!maskCtx) {

                throw new Error(
                    "Canvas 2D недоступен."
                );

            }


            const maskImageData =
                maskCtx.createImageData(
                    maskWidth,
                    maskHeight
                );


            const maskPixels =
                maskImageData.data;


            /* =================================
               8. DRAW MASK
            ================================= */

            for (
                let i = 0;
                i < alphaMask.length;
                i++
            ) {

                const value =
                    Math.round(
                        alphaMask[i] *
                        255
                    );


                const pixel =
                    i * 4;


                maskPixels[pixel] =
                    value;

                maskPixels[pixel + 1] =
                    value;

                maskPixels[pixel + 2] =
                    value;

                maskPixels[pixel + 3] =
                    255;

            }


            maskCtx.putImageData(
                maskImageData,
                0,
                0
            );


            /* =================================
               9. UPSCALE MASK
            ================================= */

            const previewCanvas =
                document.createElement(
                    "canvas"
                );


            previewCanvas.width =
                image.width;

            previewCanvas.height =
                image.height;


            const previewCtx =
                previewCanvas.getContext(
                    "2d"
                );


            previewCtx.imageSmoothingEnabled =
                true;


            previewCtx.imageSmoothingQuality =
                "high";


            previewCtx.drawImage(
                maskCanvas,
                0,
                0,
                image.width,
                image.height
            );


            /* =================================
               10. EXPORT MASK
            ================================= */

            const maskURL =
                previewCanvas.toDataURL(
                    "image/png"
                );


            resultImage.src =
                maskURL;


            /* =================================
               11. DEBUG
            ================================= */

            setStatus(
                "🔎 МАСКА ГОТОВА\n\n" +

                "Белое = модель считает " +
                "товаром.\n" +

                "Чёрное = модель считает " +
                "фоном.\n\n" +

                "Сейчас мы специально " +
                "НЕ создаём прозрачный PNG.\n\n" +

                "Посмотри на маску справа."
            );


            setDebug(
                "================================\n" +
                "BIREFNET MASK DEBUG\n" +
                "================================\n\n" +

                "Model output:\n" +
                JSON.stringify(dims) +
                "\n\n" +

                "Mask:\n" +
                maskWidth +
                " × " +
                maskHeight +
                "\n\n" +

                "Raw values:\n" +
                rawData.length +
                "\n\n" +

                "Raw minimum:\n" +
                minValue.toFixed(4) +
                "\n\n" +

                "Raw maximum:\n" +
                maxValue.toFixed(4) +
                "\n\n" +

                "Average sigmoid:\n" +
                average.toFixed(4)
            );


        } catch (error) {

            console.error(
                "MASK ERROR:",
                error
            );


            setStatus(
                "❌ Ошибка создания маски.\n\n" +
                "Тип:\n" +
                error.name +
                "\n\n" +
                "Сообщение:\n" +
                error.message
            );


            setDebug(
                "================================\n" +
                "❌ ОШИБКА\n" +
                "================================\n\n" +

                "Тип:\n" +
                error.name +
                "\n\n" +

                "Сообщение:\n" +
                error.message
            );

        }


        removeButton.disabled =
            false;

    }
);

</script>

</body>
</html>
