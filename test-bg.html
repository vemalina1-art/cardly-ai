<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardly AI — Background Removal Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
            color: #111;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .panel {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,.06);
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: #111;
            color: white;
            margin-right: 10px;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        #status {
            white-space: pre-wrap;
            background: #f4f5f6;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            line-height: 1.5;
            font-size: 14px;
        }

        .images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .image-box {
            border-radius: 15px;
            overflow: hidden;
            background: #eee;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .image-box.checker {
            background-color: #eee;
            background-image:
                linear-gradient(45deg, #ddd 25%, transparent 25%),
                linear-gradient(-45deg, #ddd 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ddd 75%),
                linear-gradient(-45deg, transparent 75%, #ddd 75%);
            background-size: 30px 30px;
            background-position: 0 0, 0 15px, 15px -15px, -15px 0;
        }

        .image-box img {
            max-width: 100%;
            max-height: 600px;
            display: block;
        }

        .label {
            position: absolute;
            left: 12px;
            top: 12px;
            background: rgba(0,0,0,.75);
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 2;
        }

        @media (max-width: 700px) {
            .images {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cardly AI — Background Removal</h1>

    <div class="subtitle">
        Тест автоматического удаления фона с помощью BiRefNet
    </div>


    <div class="panel">

        <input
            id="fileInput"
            type="file"
            accept="image/*"
        >

        <br>

        <button
            id="loadButton"
        >
            Загрузить AI-модель
        </button>

        <button
            id="removeButton"
            disabled
        >
            Удалить фон
        </button>

        <div id="status">
            Готово к запуску.
        </div>

    </div>


    <div class="panel">

        <div class="images">

            <div class="image-box">

                <div class="label">
                    Исходное фото
                </div>

                <img
                    id="originalImage"
                    alt=""
                >

            </div>


            <div class="image-box checker">

                <div class="label">
                    Без фона
                </div>

                <img
                    id="resultImage"
                    alt=""
                >

            </div>

        </div>

    </div>

</div>


<script type="module">

    /*
     * ==========================================
     * IMPORT TRANSFORMERS.JS
     * ==========================================
     */

    import {
        AutoModel,
        AutoProcessor,
        RawImage,
        env
    } from
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


    /*
     * ==========================================
     * НАСТРОЙКА PROXY
     * ==========================================
     *
     * Вместо:
     *
     * huggingface.co/...
     *
     * браузер теперь обращается к:
     *
     * cardly-ai.vemalina1.workers.dev/api/model/...
     *
     */

    env.remoteHost =
        window.location.origin + "/api/model/";

    env.remotePathTemplate =
        "{model}/resolve/{revision}/{file}";


    /*
     * Разрешаем удалённые модели
     */

    env.allowRemoteModels = true;


    /*
     * ==========================================
     * ELEMENTS
     * ==========================================
     */

    const fileInput =
        document.getElementById("fileInput");

    const loadButton =
        document.getElementById("loadButton");

    const removeButton =
        document.getElementById("removeButton");

    const status =
        document.getElementById("status");

    const originalImage =
        document.getElementById("originalImage");

    const resultImage =
        document.getElementById("resultImage");


    /*
     * ==========================================
     * VARIABLES
     * ==========================================
     */

    let model = null;
    let processor = null;
    let selectedFile = null;


    /*
     * ==========================================
     * STATUS
     * ==========================================
     */

    function setStatus(text) {

        status.textContent = text;

    }


    /*
     * ==========================================
     * FILE SELECT
     * ==========================================
     */

    fileInput.addEventListener(
        "change",
        event => {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            selectedFile = file;


            const url =
                URL.createObjectURL(file);

            originalImage.src = url;

            resultImage.src = "";


            setStatus(
                "Фото выбрано.\n\n" +
                "Теперь загрузите AI-модель."
            );

        }
    );


    /*
     * ==========================================
     * LOAD MODEL
     * ==========================================
     */

    loadButton.addEventListener(
        "click",
        async () => {

            loadButton.disabled = true;


            try {

                setStatus(
                    "⏳ Загружаю BiRefNet...\n\n" +
                    "Первый запуск может быть долгим, " +
                    "потому что браузеру нужно скачать AI-модель."
                );


                /*
                 * ==================================
                 * PROCESSOR
                 * ==================================
                 */

                processor =
                    await AutoProcessor.from_pretrained(
                        "studioludens/birefnet-lite-512"
                    );


                setStatus(
                    "✅ Processor загружен.\n\n" +
                    "Загружаю AI-модель..."
                );


                /*
                 * ==================================
                 * WEBGPU
                 * ==================================
                 */

                try {

                    setStatus(
                        "⏳ Пытаюсь запустить BiRefNet через WebGPU..."
                    );


                    model =
                        await AutoModel.from_pretrained(
                            "studioludens/birefnet-lite-512",
                            {
                                dtype: "fp16",
                                device: "webgpu"
                            }
                        );


                    setStatus(
                        "✅ BiRefNet загружен через WebGPU!"
                    );


                } catch (webgpuError) {

                    console.warn(
                        "WebGPU error:",
                        webgpuError
                    );


                    setStatus(
                        "⚠️ WebGPU не запустился.\n\n" +
                        "Пробую WASM..."
                    );


                    /*
                     * ==================================
                     * WASM FALLBACK
                     * ==================================
                     */

                    model =
                        await AutoModel.from_pretrained(
                            "studioludens/birefnet-lite-512",
                            {
                                dtype: "q8",
                                device: "wasm"
                            }
                        );


                    setStatus(
                        "✅ BiRefNet загружен через WASM!"
                    );

                }


                removeButton.disabled = false;


                setStatus(
                    status.textContent +
                    "\n\n" +
                    "🎉 AI готов.\n\n" +
                    "Выберите фото и нажмите «Удалить фон»."
                );


            } catch (error) {

                console.error(error);


                setStatus(
                    "❌ Ошибка загрузки AI-модели.\n\n" +
                    "Тип: " +
                    error.name +
                    "\n\n" +
                    "Сообщение:\n" +
                    error.message +
                    "\n\n" +
                    "Подробности смотрите в консоли браузера."
                );


                loadButton.disabled = false;

            }

        }
    );


    /*
     * ==========================================
     * REMOVE BACKGROUND
     * ==========================================
     */

    removeButton.addEventListener(
        "click",
        async () => {

            if (!model || !processor) {

                setStatus(
                    "❌ Сначала загрузите AI-модель."
                );

                return;
            }


            if (!selectedFile) {

                setStatus(
                    "❌ Сначала выберите изображение."
                );

                return;
            }


            removeButton.disabled = true;


            try {

                setStatus(
                    "⏳ Анализирую изображение...\n\n" +
                    "BiRefNet определяет объект и фон."
                );


                /*
                 * ==================================
                 * READ IMAGE
                 * ==================================
                 */

                const image =
                    await RawImage.read(
                        selectedFile
                    );


                /*
                 * ==================================
                 * PROCESS IMAGE
                 * ==================================
                 */

                const {
                    pixel_values
                } =
                    await processor(
                        image
                    );


                setStatus(
                    "⏳ AI обрабатывает изображение..."
                );


                /*
                 * ==================================
                 * RUN MODEL
                 * ==================================
                 */

                const output =
                    await model({
                        input_image:
                            pixel_values
                    });


                /*
                 * ==================================
                 * LOGITS
                 * ==================================
                 */

                let mask =
                    output.logits;


                /*
                 * ==================================
                 * SIGMOID
                 * ==================================
                 */

                mask =
                    await mask.sigmoid();


                /*
                 * ==================================
                 * CONVERT MASK
                 * ==================================
                 *
                 * Resize mask to original image
                 */

                mask =
                    await RawImage.fromTensor(
                        mask
                    );


                mask =
                    await mask.resize(
                        image.width,
                        image.height
                    );


                /*
                 * ==================================
                 * CREATE CANVAS
                 * ==================================
                 */

                const canvas =
                    document.createElement(
                        "canvas"
                    );

                canvas.width =
                    image.width;

                canvas.height =
                    image.height;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                /*
                 * ==================================
                 * DRAW ORIGINAL
                 * ==================================
                 */

                ctx.drawImage(
                    image.toCanvas(),
                    0,
                    0,
                    image.width,
                    image.height
                );


                /*
                 * ==================================
                 * GET PIXELS
                 * ==================================
                 */

                const imageData =
                    ctx.getImageData(
                        0,
                        0,
                        image.width,
                        image.height
                    );


                const pixels =
                    imageData.data;


                /*
                 * ==================================
                 * MASK DATA
                 * ==================================
                 */

                const maskData =
                    mask.data;


                /*
                 * ==================================
                 * APPLY ALPHA
                 * ==================================
                 */

                for (
                    let i = 0;
                    i < pixels.length;
                    i += 4
                ) {

                    const maskIndex =
                        i / 4;

                    const value =
                        maskData[maskIndex];


                    /*
                     * Smooth alpha
                     */

                    pixels[i + 3] =
                        Math.max(
                            0,
                            Math.min(
                                255,
                                Math.round(
                                    value * 255
                                )
                            )
                        );

                }


                /*
                 * ==================================
                 * PUT RESULT
                 * ==================================
                 */

                ctx.putImageData(
                    imageData,
                    0,
                    0
                );


                /*
                 * ==================================
                 * EXPORT PNG
                 * ==================================
                 */

                const result =
                    canvas.toDataURL(
                        "image/png"
                    );


                resultImage.src =
                    result;


                setStatus(
                    "🎉 Готово!\n\n" +
                    "Фон удалён.\n\n" +
                    "Результат находится справа " +
                    "на прозрачном фоне."
                );


            } catch (error) {

                console.error(error);


                setStatus(
                    "❌ Ошибка удаления фона.\n\n" +
                    "Тип: " +
                    error.name +
                    "\n\n" +
                    "Сообщение:\n" +
                    error.message
                );

            }


            removeButton.disabled = false;

        }
    );

</script>

</body>
</html>
