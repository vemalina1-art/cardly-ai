<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardly AI — генератор инфографики</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap');

:root {
  --blue: #3867e8;
  --ink: #172033;
  --muted: #7c879b;
  --line: #e8ecf3;
  --bg: #f5f7fb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

.header {
  height: 70px;
  padding: 0 5%;
  background: white;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: 'Onest', sans-serif;
  font-size: 23px;
  font-weight: 800;
  letter-spacing: -1.2px;
}

.logo span { color: var(--blue); }

.header-note {
  font-size: 12px;
  color: var(--muted);
}

.main {
  max-width: 1420px;
  padding: 38px 30px 60px;
  margin: auto;
}

.intro { margin-bottom: 28px; }

.intro h1 {
  font-family: 'Onest', sans-serif;
  font-size: clamp(26px, 3vw, 36px);
  letter-spacing: -1.5px;
  margin: 0 0 8px;
}

.intro p {
  color: var(--muted);
  margin: 0;
  font-size: 14px;
}

.workspace {
  display: grid;
  grid-template-columns: 380px minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}

.panel, .preview-panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(25, 42, 75, .035);
}

.panel-heading {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 22px;
}

.label {
  display: block;
  margin: 18px 0 8px;
  font-size: 12px;
  font-weight: 800;
  color: #465168;
}

.upload {
  min-height: 210px;
  border: 1.5px dashed #cbd4e3;
  border-radius: 15px;
  background: #fafbfe;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  cursor: pointer;
  transition: .2s;
  position: relative;
}

.upload:hover {
  border-color: var(--blue);
  background: #f5f8ff;
}

.upload input { display: none; }
.upload-content { padding: 18px; }
.upload-icon { font-size: 36px; margin-bottom: 9px; }
.upload-title { font-weight: 800; font-size: 14px; }

.upload-subtitle {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
}

.checker {
  background-color: #f8f9fc;
  background-image:
    linear-gradient(45deg, #e9edf4 25%, transparent 25%),
    linear-gradient(-45deg, #e9edf4 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e9edf4 75%),
    linear-gradient(-45deg, transparent 75%, #e9edf4 75%);
  background-size: 18px 18px;
  background-position: 0 0, 0 9px, 9px -9px, -9px 0;
}

.upload-preview {
  width: 100%;
  height: 210px;
  object-fit: contain;
  padding: 12px;
}

.status {
  display: none;
  margin-top: 10px;
  padding: 11px 12px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.5;
  background: #f1f5ff;
  color: #3656a6;
}

.status.error {
  display: block;
  color: #a33b3b;
  background: #fff1f1;
}

.status.success {
  display: block;
  color: #16734b;
  background: #eaf8f0;
}

.status.loading { display: block; }

.progress {
  height: 5px;
  background: #dce5fa;
  border-radius: 10px;
  margin-top: 9px;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--blue);
  transition: width .3s;
}

.input, .textarea {
  width: 100%;
  border: 1px solid #dce2ec;
  border-radius: 11px;
  padding: 12px 13px;
  outline: none;
  color: var(--ink);
  background: white;
  font-size: 13px;
}

.input:focus, .textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(56,103,232,.09);
}

.textarea {
  min-height: 115px;
  resize: vertical;
}

.generate {
  width: 100%;
  border: 0;
  border-radius: 12px;
  background: var(--blue);
  color: white;
  font-weight: 800;
  padding: 15px;
  margin-top: 22px;
  box-shadow: 0 7px 16px rgba(56,103,232,.2);
  transition: .2s;
}

.generate:hover { background: #2855d0; }
.generate:disabled { opacity: .55; cursor: wait; }

.ai-generate {
  background: #172033;
  margin-top: 10px;
}

.ai-generate:hover { background: #293b5b; }

.preview-panel { min-height: 700px; }

.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}

.preview-title {
  font-size: 17px;
  font-weight: 800;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.secondary {
  border: 1px solid var(--line);
  background: white;
  color: #465168;
  padding: 9px 12px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 700;
}

.secondary:hover { background: #f5f7fb; }

.empty {
  min-height: 610px;
  border: 1px dashed #d9dfeb;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--muted);
  padding: 25px;
}

.empty-icon { font-size: 44px; margin-bottom: 15px; }
.empty strong { color: #465168; font-size: 14px; }

.empty p {
  font-size: 12px;
  line-height: 1.6;
}

.card-wrapper {
  display: none;
  justify-content: center;
  padding: 10px;
}

.card {
  width: min(450px, 100%);
  aspect-ratio: 3 / 4;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  container-type: inline-size;
  color: #172033;
  background: #f2f5fa;
}

.card.dark { color: white; }

/* AI SCENE BACKGROUND */

.scene-background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

.scene-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(
    180deg,
    rgba(255,255,255,.18),
    transparent 35%,
    transparent 70%,
    rgba(0,0,0,.08)
  );
  pointer-events: none;
}

.card.dark .scene-overlay {
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.2),
    transparent 40%,
    rgba(0,0,0,.16)
  );
}

.card-title {
  position: absolute;
  z-index: 5;
  margin: 0;
  max-width: 78%;
  font-family: 'Onest', sans-serif;
  font-weight: 800;
  font-size: clamp(25px, 8cqw, 39px);
  line-height: 1.02;
  letter-spacing: -1.7px;
  overflow-wrap: anywhere;
}

.title-top { top: 8%; left: 7%; }
.title-middle { top: 38%; left: 7%; }
.title-bottom { bottom: 8%; left: 7%; }

.card-subtitle {
  position: absolute;
  z-index: 5;
  left: 7%;
  top: 19%;
  max-width: 65%;
  font-size: clamp(10px, 2.8cqw, 13px);
  line-height: 1.45;
  opacity: .72;
}

.product {
  position: absolute;
  z-index: 3;
  object-fit: contain;
  filter: drop-shadow(0 20px 17px rgba(0,0,0,.17));
}

/* Более естественная интеграция вырезанного товара в AI-сцену.
   Тень повторяет силуэт PNG, а не создаёт случайный предмет под ним. */
.card.scene-composition .product {
  filter:
    drop-shadow(0 15px 12px rgba(12, 20, 30, .24))
    drop-shadow(0 3px 4px rgba(12, 20, 30, .16));
}

.card.scene-composition .scene-overlay {
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.30) 0%,
      rgba(255,255,255,.08) 24%,
      transparent 43%,
      transparent 68%,
      rgba(12,20,30,.18) 100%
    );
}

.card.scene-composition .card-title {
  text-shadow: 0 1px 10px rgba(255,255,255,.28);
}

.card.scene-composition .feature {
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(8px);
}

.product.center {
  width: 70%;
  max-height: 66%;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
}

.product.left {
  width: 59%;
  max-height: 68%;
  left: 3%;
  top: 53%;
  transform: translateY(-50%);
}

.product.right {
  width: 59%;
  max-height: 68%;
  right: 3%;
  top: 53%;
  transform: translateY(-50%);
}

.features {
  position: absolute;
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-width: 43%;
}

.features.bottom {
  left: 7%;
  right: 7%;
  bottom: 6%;
  max-width: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.features.left { left: 7%; bottom: 8%; }
.features.right { right: 7%; bottom: 8%; }

.feature {
  background: rgba(255,255,255,.88);
  color: #26334a;
  border-radius: 8px;
  padding: 9px 11px;
  font-size: clamp(9px, 2.3cqw, 11px);
  font-weight: 700;
  line-height: 1.3;
  box-shadow: 0 4px 14px rgba(20,35,60,.06);
  border-left: 3px solid var(--accent, #3867e8);
}

.card.dark .feature { background: rgba(255,255,255,.94); }

.design-label {
  position: absolute;
  z-index: 7;
  top: 4%;
  right: 6%;
  font-size: 8px;
  letter-spacing: 1.3px;
  font-weight: 800;
  opacity: .55;
}

.card.hero { background: linear-gradient(145deg,#fff,#eaf0fb); }
.card.split { background: linear-gradient(110deg,#edf3ff 0 48%,#fff 48%); }
.card.editorial { background: #f5f1e9; }
.card.dynamic { background: linear-gradient(145deg,#e8f5f7,#f7fbff); }
.card.info { background: #f2f5fa; }
.card.premium { background: #f8f6f1; }
.card.dark { background: linear-gradient(145deg,#172033,#263955); }

.card.hero .product { width: 76%; }
.card.editorial .product { width: 64%; }
.card.dynamic .product { width: 68%; }
.card.info .product { width: 61%; }
.card.premium .product { width: 72%; }

.card.split .card-title {
  max-width: 43%;
  font-size: clamp(22px,6.5cqw,32px);
}

.card.editorial .card-title {
  font-family: 'Manrope',sans-serif;
  font-weight: 700;
}

.card.premium .card-title {
  font-weight: 600;
  letter-spacing: -1px;
}

.accent-blue { --accent: #3867e8; }
.accent-cyan { --accent: #0891b2; }
.accent-green { --accent: #16845b; }
.accent-orange { --accent: #e87932; }
.accent-violet { --accent: #7954c8; }
.accent-black { --accent: #26334a; }

@media (max-width: 950px) {
  .workspace { grid-template-columns: 1fr; }
  .preview-panel { min-height: auto; }
  .empty { min-height: 350px; }
}

@media (max-width: 560px) {
  .main { padding: 25px 14px; }
  .header { padding: 0 18px; }
  .header-note { display: none; }
  .panel, .preview-panel { padding: 17px; }
  .preview-header {
    align-items: flex-start;
    flex-direction: column;
  }
}
</style>
</head>
