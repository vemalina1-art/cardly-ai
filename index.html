<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cardly AI — генератор инфографики</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

button,
input,
textarea {
    font: inherit;
}

.header {
    height: 72px;
    background: white;
    border-bottom: 1px solid #e5e7eb;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 32px;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.logo span {
    color: #2563eb;
}

.header-right {
    font-size: 14px;
    color: #6b7280;
}


/* ============================= */
/* MAIN */
/* ============================= */

.main {
    max-width: 1400px;
    margin: auto;
    padding: 36px;
}

.page-title {
    margin-bottom: 28px;
}

.page-title h1 {
    margin: 0 0 8px;
    font-size: 32px;
    letter-spacing: -1px;
}

.page-title p {
    margin: 0;
    color: #6b7280;
}


/* ============================= */
/* WORKSPACE */
/* ============================= */

.workspace {
    display: grid;
    grid-template-columns: 390px 1fr;
    gap: 28px;
}


/* ============================= */
/* LEFT PANEL */
/* ============================= */

.panel {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    padding: 24px;

    box-shadow:
        0 10px 30px rgba(15, 23, 42, 0.05);
}

.panel-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
}

.label {
    display: block;
    margin-bottom: 8px;

    font-size: 13px;
    font-weight: 600;

    color: #374151;
}

.input,
.textarea {
    width: 100%;

    border: 1px solid #dbe1ea;
    border-radius: 12px;

    padding: 13px 14px;

    outline: none;

    transition: .2s;
}

.input:focus,
.textarea:focus {
    border-color: #2563eb;

    box-shadow:
        0 0 0 3px rgba(37, 99, 235, .1);
}

.textarea {
    min-height: 120px;
    resize: vertical;
}


/* ============================= */
/* UPLOAD */
/* ============================= */

.upload {
    position: relative;

    border: 2px dashed #d5dbe5;
    border-radius: 16px;

    min-height: 230px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    cursor: pointer;

    overflow: hidden;

    transition: .2s;
}

.upload:hover {
    border-color: #2563eb;
    background: #f8faff;
}

.upload input {
    display: none;
}

.upload-content {
    padding: 20px;
}

.upload-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

.upload-title {
    font-weight: 700;
    margin-bottom: 5px;
}

.upload-subtitle {
    font-size: 13px;
    color: #6b7280;
}

.upload img {
    width: 100%;
    height: 230px;

    object-fit: contain;

    padding: 15px;
}


/* ============================= */
/* BUTTON */
/* ============================= */

.generate {
    width: 100%;

    margin-top: 20px;

    padding: 15px;

    border: none;
    border-radius: 13px;

    background: #2563eb;
    color: white;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.generate:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
}

.generate:disabled {
    opacity: .6;
    cursor: wait;
}


/* ============================= */
/* RIGHT */
/* ============================= */

.preview-panel {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 20px;

    padding: 24px;

    min-height: 700px;
}

.preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.preview-title {
    font-size: 18px;
    font-weight: 700;
}

.variant {
    border: 1px solid #dbe1ea;

    background: white;

    border-radius: 10px;

    padding: 9px 14px;

    cursor: pointer;
}

.variant:hover {
    background: #f5f7fb;
}


/* ============================= */
/* EMPTY */
/* ============================= */

.empty {
    min-height: 620px;

    border-radius: 16px;

    border: 1px dashed #d5dbe5;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #9ca3af;

    text-align: center;
}

.empty-inner {
    max-width: 300px;
}

.empty-icon {
    font-size: 50px;
    margin-bottom: 15px;
}


/* ============================= */
/* CARD */
/* ============================= */

.card-wrapper {
    display: flex;
    justify-content: center;
}

.card {
    width: min(450px, 100%);
    aspect-ratio: 3 / 4;

    position: relative;

    overflow: hidden;

    border-radius: 4px;

    background: #f5f5f5;

    isolation: isolate;
}


/* ============================= */
/* BACKGROUNDS */
/* ============================= */

.bg-light {
    background:
        linear-gradient(
            135deg,
            #ffffff,
            #edf2f7
        );
}

.bg-dark {
    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937
        );

    color: white;
}

.bg-gradient {
    background:
        radial-gradient(
            circle at 20% 10%,
            #dbeafe,
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #ffffff,
            #e0f2fe
        );
}

.bg-soft {
    background:
        radial-gradient(
            circle at 80% 20%,
            #e5e7eb,
            transparent 35%
        ),
        #f8fafc;
}

.bg-accent {
    background:
        linear-gradient(
            145deg,
            #eff6ff,
            #dbeafe
        );
}


/* ============================= */
/* ACCENTS */
/* ============================= */

.accent-blue {
    --accent: #2563eb;
}

.accent-cyan {
    --accent: #06b6d4;
}

.accent-green {
    --accent: #16a34a;
}

.accent-orange {
    --accent: #f97316;
}

.accent-violet {
    --accent: #7c3aed;
}

.accent-red {
    --accent: #ef4444;
}

.accent-none {
    --accent: #111827;
}


/* ============================= */
/* PRODUCT */
/* ============================= */

.product {
    position: absolute;

    object-fit: contain;

    z-index: 5;

    transition: .3s;
}

.product-shadow {
    filter:
        drop-shadow(
            0 25px 22px rgba(0,0,0,.18)
        );
}

.product-shadow-medium {
    filter:
        drop-shadow(
            0 30px 28px rgba(0,0,0,.28)
        );
}


/* ============================= */
/* POSITIONS */
/* ============================= */

.pos-center {
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);
}

.pos-center-bottom {
    left: 50%;
    bottom: 4%;

    transform:
        translateX(-50%);
}

.pos-center-top {
    left: 50%;
    top: 18%;

    transform:
        translateX(-50%);
}

.pos-left {
    left: 4%;
    top: 50%;

    transform:
        translateY(-50%);
}

.pos-right {
    right: 4%;
    top: 50%;

    transform:
        translateY(-50%);
}

.pos-left-bottom {
    left: 3%;
    bottom: 5%;
}

.pos-right-bottom {
    right: 3%;
    bottom: 5%;
}

.pos-left-top {
    left: 3%;
    top: 10%;
}

.pos-right-top {
    right: 3%;
    top: 10%;
}


/* ============================= */
/* TEXT */
/* ============================= */

.card-title {
    position: absolute;

    z-index: 10;

    margin: 0;

    max-width: 82%;

    font-size: 32px;

    line-height: 1.02;

    letter-spacing: -1.5px;

    font-weight: 850;
}

.card-subtitle {
    position: absolute;

    z-index: 10;

    max-width: 65%;

    font-size: 14px;

    line-height: 1.4;

    opacity: .72;
}

.features {
    position: absolute;

    z-index: 10;

    display: flex;

    flex-direction: column;

    gap: 8px;

    max-width: 45%;
}

.feature {
    padding: 9px 12px;

    background: rgba(255,255,255,.78);

    backdrop-filter: blur(8px);

    border-radius: 10px;

    font-size: 11px;

    line-height: 1.3;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.dark-card .feature {
    background: rgba(255,255,255,.1);
}


/* ============================= */
/* TITLE POSITIONS */
/* ============================= */

.title-top-left {
    top: 8%;
    left: 7%;
}

.title-top-center {
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
}

.title-top-right {
    top: 8%;
    right: 7%;
    text-align: right;
}

.title-middle-left {
    left: 7%;
    top: 40%;
}

.title-middle-right {
    right: 7%;
    top: 40%;
    text-align: right;
}

.title-bottom-left {
    left: 7%;
    bottom: 8%;
}


/* ============================= */
/* FEATURES POSITIONS */
/* ============================= */

.features-left {
    left: 7%;
    bottom: 8%;
}

.features-right {
    right: 7%;
    bottom: 8%;
}

.features-bottom {
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    width: 84%;
    max-width: none;

    display: grid;
    grid-template-columns: 1fr 1fr;
}

.features-bottom-left {
    left: 7%;
    bottom: 7%;
}

.features-bottom-right {
    right: 7%;
    bottom: 7%;
}

.features-around {
    left: 7%;
    right: 7%;
    bottom: 8%;
}


/* ============================= */
/* DECORATIONS */
/* ============================= */

.decor {
    position: absolute;

    z-index: 1;

    pointer-events: none;
}

.decor-line {
    width: 160px;
    height: 2px;

    background: var(--accent);

    opacity: .55;

    transform: rotate(-25deg);
}

.decor-circle {
    width: 150px;
    height: 150px;

    border-radius: 50%;

    border: 2px solid var(--accent);

    opacity: .2;
}

.decor-blob {
    width: 230px;
    height: 180px;

    border-radius: 50%;

    background: var(--accent);

    opacity: .09;

    filter: blur(2px);
}

.decor-grid {
    width: 100%;
    height: 100%;

    opacity: .08;

    background-image:
        linear-gradient(
            var(--accent) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            var(--accent) 1px,
            transparent 1px
        );

    background-size: 25px 25px;
}


/* ============================= */
/* DESIGN VARIATIONS */
/* ============================= */


/* HERO */

.design-hero .card-title {
    font-size: 34px;
}

.design-hero .product {
    width: 78%;
}


/* SPLIT */

.design-split .card-title {
    font-size: 31px;
    max-width: 45%;
}

.design-split .product {
    width: 54%;
}


/* EDITORIAL */

.design-editorial .card-title {
    font-size: 39px;
    max-width: 75%;
}

.design-editorial .product {
    width: 62%;
}

.design-editorial::after {
    content: "";
    position: absolute;

    right: -60px;
    top: 25%;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    border: 35px solid var(--accent);

    opacity: .08;
}


/* DYNAMIC */

.design-dynamic .card-title {
    font-size: 36px;
    max-width: 70%;
}

.design-dynamic .product {
    width: 68%;
}

.design-dynamic::before {
    content: "";

    position: absolute;

    width: 150%;
    height: 180px;

    left: -25%;
    top: 45%;

    background: var(--accent);

    opacity: .08;

    transform: rotate(-14deg);
}


/* INFO */

.design-info .card-title {
    font-size: 29px;
    max-width: 70%;
}

.design-info .product {
    width: 58%;
}

.design-info .feature {
    border-left: 3px solid var(--accent);
}


/* PREMIUM */

.design-premium {
    background: #fafafa;
}

.design-premium .card-title {
    font-size: 38px;
    font-weight: 700;
}

.design-premium .product {
    width: 76%;
}

.design-premium .feature {
    background: rgba(255,255,255,.9);

    border: 1px solid rgba(0,0,0,.07);

    box-shadow: none;
}


/* ============================= */
/* DESIGN LABEL */
/* ============================= */

.design-label {
    position: absolute;

    top: 14px;
    left: 14px;

    z-index: 20;

    padding: 6px 9px;

    border-radius: 7px;

    background: rgba(255,255,255,.75);

    backdrop-filter: blur(10px);

    font-size: 9px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: .5px;

    color: #374151;
}


/* ============================= */
/* RESPONSIVE */
/* ============================= */

@media (max-width: 1000px) {

    .workspace {
        grid-template-columns: 1fr;
    }

    .preview-panel {
        min-height: auto;
    }

}

@media (max-width: 600px) {

    .main {
        padding: 18px;
    }

    .header {
        padding: 0 18px;
    }

    .page-title h1 {
        font-size: 26px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="logo">
        Cardly <span>AI</span>
    </div>

    <div class="header-right">
        AI генератор инфографики
    </div>

</header>


<main class="main">


    <div class="page-title">

        <h1>Создайте карточку товара</h1>

        <p>
            Загрузите товар — AI создаст композицию и текст инфографики
        </p>

    </div>


    <div class="workspace">


        <!-- ====================== -->
        <!-- LEFT -->
        <!-- ====================== -->

        <section class="panel">

            <div class="panel-title">
                Данные товара
            </div>


            <label class="label">
                Фото товара
            </label>

            <label class="upload" id="uploadBox">

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >

                <div
                    class="upload-content"
                    id="uploadContent"
                >

                    <div class="upload-icon">
                        📦
                    </div>

                    <div class="upload-title">
                        Загрузите фото
                    </div>

                    <div class="upload-subtitle">
                        PNG, JPG или WEBP
                    </div>

                </div>

            </label>


            <div style="height:20px"></div>


            <label class="label">
                Название товара
            </label>

            <input
                id="productName"
                class="input"
                placeholder="Например: Смеситель для кухни"
            >


            <div style="height:16px"></div>


            <label class="label">
                Характеристики
            </label>

            <textarea
                id="featuresInput"
                class="textarea"
                placeholder="Например:
Материал: нержавеющая сталь
Высота: 35 см
Цвет: чёрный
Поворотный излив"
            ></textarea>


            <button
                class="generate"
                id="generateBtn"
            >
                ✨ Создать карточку
            </button>

        </section>


        <!-- ====================== -->
        <!-- RIGHT -->
        <!-- ====================== -->

        <section class="preview-panel">


            <div class="preview-header">

                <div class="preview-title">
                    Предпросмотр
                </div>

                <button
                    class="variant"
                    id="variantBtn"
                    style="display:none"
                >
                    Другой вариант
                </button>

            </div>


            <div
                class="empty"
                id="emptyPreview"
            >

                <div class="empty-inner">

                    <div class="empty-icon">
                        ✨
                    </div>

                    <strong>
                        Здесь появится ваша инфографика
                    </strong>

                    <p>
                        AI выберет композицию,
                        расположение товара,
                        фон и оформление.
                    </p>

                </div>

            </div>


            <div
                class="card-wrapper"
                id="cardWrapper"
                style="display:none"
            >

                <div
                    class="card"
                    id="card"
                >

                </div>

            </div>


        </section>


    </div>


</main>


<script>


/* ================================= */
/* VARIABLES */
/* ================================= */

const imageInput =
    document.getElementById("imageInput");

const uploadBox =
    document.getElementById("uploadBox");

const uploadContent =
    document.getElementById("uploadContent");

const productName =
    document.getElementById("productName");

const featuresInput =
    document.getElementById("featuresInput");

const generateBtn =
    document.getElementById("generateBtn");

const variantBtn =
    document.getElementById("variantBtn");

const emptyPreview =
    document.getElementById("emptyPreview");

const cardWrapper =
    document.getElementById("cardWrapper");

const card =
    document.getElementById("card");


let uploadedImage = null;

let lastGenerated = null;


/* ================================= */
/* IMAGE UPLOAD */
/* ================================= */

imageInput.addEventListener(
    "change",
    function () {

        const file = this.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload = function (e) {

            uploadedImage =
                e.target.result;

            uploadContent.innerHTML = `
                <img src="${uploadedImage}">
            `;

        };

        reader.readAsDataURL(file);

    }
);


/* ================================= */
/* GENERATE */
/* ================================= */

async function generateCard() {

    if (!uploadedImage) {

        alert(
            "Сначала загрузите фото товара"
        );

        return;
    }


    if (!productName.value.trim()) {

        alert(
            "Введите название товара"
        );

        return;
    }


    generateBtn.disabled = true;

    generateBtn.textContent =
        "✨ AI создаёт дизайн...";


    try {

        const response =
            await fetch(
                "/api/generate",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        productName:
                            productName.value,

                        features:
                            featuresInput.value

                    })

                }
            );


        const data =
            await response.json();


        if (data.error) {

            throw new Error(
                data.error
            );

        }


        lastGenerated = data;

        renderCard(data);


        emptyPreview.style.display =
            "none";

        cardWrapper.style.display =
            "flex";

        variantBtn.style.display =
            "block";


    } catch (error) {

        console.error(error);

        alert(
            "Ошибка: " +
            error.message
        );

    }


    generateBtn.disabled = false;

    generateBtn.textContent =
        "✨ Создать карточку";

}


/* ================================= */
/* RENDER CARD */
/* ================================= */

function renderCard(data) {


    const design =
        data.design || "hero";

    const background =
        data.background || "light";

    const accent =
        data.accent || "blue";

    const productPosition =
        data.productPosition ||
        "center-bottom";

    const productScale =
        data.productScale ||
        0.8;

    const titlePosition =
        data.titlePosition ||
        "top-left";

    const featuresPosition =
        data.featuresPosition ||
        "bottom";

    const shadow =
        data.shadow ||
        "soft";


    /* CARD */

    card.className =
        `card
        design-${design}
        bg-${background}
        accent-${accent}`;


    if (background === "dark") {

        card.classList.add(
            "dark-card"
        );

    }


    /* PRODUCT */

    let shadowClass = "";

    if (shadow === "soft") {

        shadowClass =
            "product-shadow";

    }

    if (shadow === "medium") {

        shadowClass =
            "product-shadow-medium";

    }


    const productWidth =
        Math.round(
            productScale * 100
        );


    /* FEATURES */

    const featureList =
        Array.isArray(data.features)
            ? data.features
            : [];


    const featuresHTML =
        featureList
            .slice(0, 4)
            .map(
                feature =>
                    `<div class="feature">
                        ${escapeHTML(feature)}
                    </div>`
            )
            .join("");


    /* DECOR */

    const decoration =
        data.decoration ||
        "none";


    let decorationHTML = "";


    if (decoration === "lines") {

        decorationHTML = `
            <div
                class="decor decor-line"
                style="
                    top:25%;
                    right:0;
                "
            ></div>

            <div
                class="decor decor-line"
                style="
                    bottom:20%;
                    left:-20px;
                "
            ></div>
        `;

    }


    if (decoration === "circles") {

        decorationHTML = `
            <div
                class="decor decor-circle"
                style="
                    top:-40px;
                    right:-40px;
                "
            ></div>

            <div
                class="decor decor-circle"
                style="
                    bottom:40px;
                    left:-60px;
                "
            ></div>
        `;

    }


    if (decoration === "blobs") {

        decorationHTML = `
            <div
                class="decor decor-blob"
                style="
                    top:-50px;
                    right:-70px;
                "
            ></div>

            <div
                class="decor decor-blob"
                style="
                    bottom:-70px;
                    left:-70px;
                "
            ></div>
        `;

    }


    if (decoration === "grid") {

        decorationHTML = `
            <div class="decor decor-grid"></div>
        `;

    }


    if (decoration === "diagonal") {

        decorationHTML = `
            <div
                class="decor"
                style="
                    width:150%;
                    height:100px;
                    left:-25%;
                    top:40%;
                    background:var(--accent);
                    opacity:.08;
                    transform:rotate(-18deg);
                "
            ></div>
        `;

    }


    /* DESIGN LABEL */

    const designNames = {

        hero: "PRODUCT HERO",

        split: "SPLIT",

        editorial: "EDITORIAL",

        dynamic: "DYNAMIC",

        info: "INFOGRAPHIC",

        premium: "PREMIUM"

    };


    card.innerHTML = `

        <div class="design-label">
            ${designNames[design] || "CARDLY AI"}
        </div>


        ${decorationHTML}


        <h2
            class="
                card-title
                title-${titlePosition}
            "
        >
            ${escapeHTML(
                data.title ||
                productName.value
            )}
        </h2>


        <div
            class="card-subtitle"
            style="
                ${
                    titlePosition.includes("right")
                    ? "right:7%;"
                    : "left:7%;"
                }

                ${
                    titlePosition.includes("top")
                    ? "top:18%;"
                    : "top:55%;"
                }
            "
        >
            ${escapeHTML(
                data.subtitle || ""
            )}
        </div>


        <img
            src="${uploadedImage}"
            class="
                product
                pos-${productPosition}
                ${shadowClass}
            "
            style="
                width:${productWidth}%;
            "
        >


        <div
            class="
                features
                features-${featuresPosition}
            "
        >

            ${featuresHTML}

        </div>

    `;

}


/* ================================= */
/* OTHER VARIANT */
/* ================================= */

variantBtn.addEventListener(
    "click",
    async function () {

        if (!productName.value.trim())
            return;


        generateBtn.disabled = true;

        variantBtn.disabled = true;

        variantBtn.textContent =
            "Создаю...";


        try {

            const response =
                await fetch(
                    "/api/generate",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            productName:
                                productName.value,

                            features:
                                featuresInput.value

                        })

                    }
                );


            const data =
                await response.json();


            if (data.error)
                throw new Error(
                    data.error
                );


            lastGenerated = data;

            renderCard(data);


        } catch (error) {

            alert(
                "Ошибка: " +
                error.message
            );

        }


        generateBtn.disabled = false;

        variantBtn.disabled = false;

        variantBtn.textContent =
            "Другой вариант";

    }
);


/* ================================= */
/* HTML ESCAPE */
/* ================================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ================================= */
/* BUTTON */
/* ================================= */

generateBtn.addEventListener(
    "click",
    generateCard
);


</script>
