
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardly AI — генератор инфографики</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap');

:root {
  --blue: #3867e8;
  --ink: #172033;
  --muted: #7c879b;
  --line: #e8ecf3;
  --bg: #f5f7fb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

.header {
  height: 70px;
  padding: 0 5%;
  background: white;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: 'Onest', sans-serif;
  font-size: 23px;
  font-weight: 800;
  letter-spacing: -1.2px;
}

.logo span { color: var(--blue); }

.header-note {
  font-size: 12px;
  color: var(--muted);
}

.main {
  max-width: 1420px;
  padding: 38px 30px 60px;
  margin: auto;
}

.intro { margin-bottom: 28px; }

.intro h1 {
  font-family: 'Onest', sans-serif;
  font-size: clamp(26px, 3vw, 36px);
  letter-spacing: -1.5px;
  margin: 0 0 8px;
}

.intro p {
  color: var(--muted);
  margin: 0;
  font-size: 14px;
}

.workspace {
  display: grid;
  grid-template-columns: 380px minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}

.panel, .preview-panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(25, 42, 75, .035);
}

.panel-heading {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 22px;
}

.label {
  display: block;
  margin: 18px 0 8px;
  font-size: 12px;
  font-weight: 800;
  color: #465168;
}

.upload {
  min-height: 210px;
  border: 1.5px dashed #cbd4e3;
  border-radius: 15px;
  background: #fafbfe;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  cursor: pointer;
  transition: .2s;
  position: relative;
}

.upload:hover {
  border-color: var(--blue);
  background: #f5f8ff;
}

.upload input { display: none; }
.upload-content { padding: 18px; }
.upload-icon { font-size: 36px; margin-bottom: 9px; }
.upload-title { font-weight: 800; font-size: 14px; }

.upload-subtitle {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
}

.checker {
  background-color: #f8f9fc;
  background-image:
    linear-gradient(45deg, #e9edf4 25%, transparent 25%),
    linear-gradient(-45deg, #e9edf4 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e9edf4 75%),
    linear-gradient(-45deg, transparent 75%, #e9edf4 75%);
  background-size: 18px 18px;
  background-position: 0 0, 0 9px, 9px -9px, -9px 0;
}

.upload-preview {
  width: 100%;
  height: 210px;
  object-fit: contain;
  padding: 12px;
}

.status {
  display: none;
  margin-top: 10px;
  padding: 11px 12px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.5;
  background: #f1f5ff;
  color: #3656a6;
}

.status.error {
  display: block;
  color: #a33b3b;
  background: #fff1f1;
}

.status.success {
  display: block;
  color: #16734b;
  background: #eaf8f0;
}

.status.loading { display: block; }

.progress {
  height: 5px;
  background: #dce5fa;
  border-radius: 10px;
  margin-top: 9px;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--blue);
  transition: width .3s;
}

.input, .textarea {
  width: 100%;
  border: 1px solid #dce2ec;
  border-radius: 11px;
  padding: 12px 13px;
  outline: none;
  color: var(--ink);
  background: white;
  font-size: 13px;
}

.input:focus, .textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(56,103,232,.09);
}

.textarea {
  min-height: 115px;
  resize: vertical;
}

.generate {
  width: 100%;
  border: 0;
  border-radius: 12px;
  background: var(--blue);
  color: white;
  font-weight: 800;
  padding: 15px;
  margin-top: 22px;
  box-shadow: 0 7px 16px rgba(56,103,232,.2);
  transition: .2s;
}

.generate:hover { background: #2855d0; }
.generate:disabled { opacity: .55; cursor: wait; }

.ai-generate {
  background: #172033;
  margin-top: 10px;
}

.ai-generate:hover { background: #293b5b; }

.preview-panel { min-height: 700px; }

.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}

.preview-title {
  font-size: 17px;
  font-weight: 800;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.secondary {
  border: 1px solid var(--line);
  background: white;
  color: #465168;
  padding: 9px 12px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 700;
}

.secondary:hover { background: #f5f7fb; }

.empty {
  min-height: 610px;
  border: 1px dashed #d9dfeb;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--muted);
  padding: 25px;
}

.empty-icon { font-size: 44px; margin-bottom: 15px; }
.empty strong { color: #465168; font-size: 14px; }

.empty p {
  font-size: 12px;
  line-height: 1.6;
}

.card-wrapper {
  display: none;
  justify-content: center;
  padding: 10px;
}

.card {
  width: min(450px, 100%);
  aspect-ratio: 3 / 4;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  container-type: inline-size;
  color: #172033;
  background: #f2f5fa;
}

.card.dark { color: white; }

/* AI SCENE BACKGROUND */

.scene-background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

.scene-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(
    180deg,
    rgba(255,255,255,.18),
    transparent 35%,
    transparent 70%,
    rgba(0,0,0,.08)
  );
  pointer-events: none;
}

.card.dark .scene-overlay {
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.2),
    transparent 40%,
    rgba(0,0,0,.16)
  );
}

.card-title {
  position: absolute;
  z-index: 5;
  margin: 0;
  max-width: 78%;
  font-family: 'Onest', sans-serif;
  font-weight: 800;
  font-size: clamp(25px, 8cqw, 39px);
  line-height: 1.02;
  letter-spacing: -1.7px;
  overflow-wrap: anywhere;
}

.title-top { top: 8%; left: 7%; }
.title-middle { top: 38%; left: 7%; }
.title-bottom { bottom: 8%; left: 7%; }

.card-subtitle {
  position: absolute;
  z-index: 5;
  left: 7%;
  top: 19%;
  max-width: 65%;
  font-size: clamp(10px, 2.8cqw, 13px);
  line-height: 1.45;
  opacity: .72;
}

.product {
  position: absolute;
  z-index: 3;
  object-fit: contain;
  filter: drop-shadow(0 20px 17px rgba(0,0,0,.17));
}

.product.center {
  width: 70%;
  max-height: 66%;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
}

.product.left {
  width: 59%;
  max-height: 68%;
  left: 3%;
  top: 53%;
  transform: translateY(-50%);
}

.product.right {
  width: 59%;
  max-height: 68%;
  right: 3%;
  top: 53%;
  transform: translateY(-50%);
}

.features {
  position: absolute;
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-width: 43%;
}

.features.bottom {
  left: 7%;
  right: 7%;
  bottom: 6%;
  max-width: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.features.left { left: 7%; bottom: 8%; }
.features.right { right: 7%; bottom: 8%; }

.feature {
  background: rgba(255,255,255,.88);
  color: #26334a;
  border-radius: 8px;
  padding: 9px 11px;
  font-size: clamp(9px, 2.3cqw, 11px);
  font-weight: 700;
  line-height: 1.3;
  box-shadow: 0 4px 14px rgba(20,35,60,.06);
  border-left: 3px solid var(--accent, #3867e8);
}

.card.dark .feature { background: rgba(255,255,255,.94); }

.design-label {
  position: absolute;
  z-index: 7;
  top: 4%;
  right: 6%;
  font-size: 8px;
  letter-spacing: 1.3px;
  font-weight: 800;
  opacity: .55;
}

.card.hero { background: linear-gradient(145deg,#fff,#eaf0fb); }
.card.split { background: linear-gradient(110deg,#edf3ff 0 48%,#fff 48%); }
.card.editorial { background: #f5f1e9; }
.card.dynamic { background: linear-gradient(145deg,#e8f5f7,#f7fbff); }
.card.info { background: #f2f5fa; }
.card.premium { background: #f8f6f1; }
.card.dark { background: linear-gradient(145deg,#172033,#263955); }

.card.hero .product { width: 76%; }
.card.editorial .product { width: 64%; }
.card.dynamic .product { width: 68%; }
.card.info .product { width: 61%; }
.card.premium .product { width: 72%; }

.card.split .card-title {
  max-width: 43%;
  font-size: clamp(22px,6.5cqw,32px);
}

.card.editorial .card-title {
  font-family: 'Manrope',sans-serif;
  font-weight: 700;
}

.card.premium .card-title {
  font-weight: 600;
  letter-spacing: -1px;
}

.accent-blue { --accent: #3867e8; }
.accent-cyan { --accent: #0891b2; }
.accent-green { --accent: #16845b; }
.accent-orange { --accent: #e87932; }
.accent-violet { --accent: #7954c8; }
.accent-black { --accent: #26334a; }

@media (max-width: 950px) {
  .workspace { grid-template-columns: 1fr; }
  .preview-panel { min-height: auto; }
  .empty { min-height: 350px; }
}

@media (max-width: 560px) {
  .main { padding: 25px 14px; }
  .header { padding: 0 18px; }
  .header-note { display: none; }
  .panel, .preview-panel { padding: 17px; }
  .preview-header {
    align-items: flex-start;
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Cardly <span>AI</span></div>
  <div class="header-note">Умная инфографика для маркетплейсов</div>
</header>

<main class="main">
  <div class="intro">
    <h1>Создайте карточку товара</h1>
    <p>Загрузите фото — удалим фон и подготовим дизайн инфографики.</p>
  </div>

  <div class="workspace">
    <section class="panel">
      <div class="panel-heading">Данные товара</div>

      <label class="label">Фотография товара</label>
      <label class="upload checker" id="uploadBox">
        <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp">
        <div class="upload-content" id="uploadContent">
          <div class="upload-icon">✦</div>
          <div class="upload-title">Загрузите фотографию</div>
          <div class="upload-subtitle">PNG, JPG или WEBP</div>
        </div>
      </label>

      <div class="status" id="removeStatus">
        <div id="statusText">Подготовка...</div>
        <div class="progress"><span id="progressBar"></span></div>
      </div>

      <label class="label" for="productName">Название товара</label>
      <input class="input" id="productName" placeholder="Например: Смеситель для кухни">

      <label class="label" for="featuresInput">Характеристики</label>
      <textarea class="textarea" id="featuresInput" placeholder="Материал: латунь&#10;Цвет: хром&#10;Тип установки: настенный"></textarea>

      <button class="generate" id="generateBtn" disabled>
        ✨ Создать карточку
      </button>

      <label class="label" for="styleSelect">Стиль рекламной композиции</label>

      <select class="input" id="styleSelect">
        <option value="premium">Premium Advertising</option>
        <option value="editorial">Editorial Style</option>
        <option value="showcase">Product Showcase</option>
        <option value="lifestyle">Lifestyle</option>
        <option value="infographic">Modern Infographic</option>
        <option value="cinematic">Cinematic Style</option>
      </select>

      <button
        class="generate ai-generate"
        id="aiSceneBtn"
        disabled
      >
        ✦ Создать AI-композицию
      </button>
    </section>

    <section class="preview-panel">
      <div class="preview-header">
        <div class="preview-title">Предпросмотр</div>
        <div class="actions">
          <button class="secondary" id="variantBtn" style="display:none">
            Другой вариант
          </button>
          <button class="secondary" id="downloadBtn" style="display:none">
            Скачать PNG
          </button>
        </div>
      </div>

      <div class="empty" id="emptyPreview">
        <div>
          <div class="empty-icon">✧</div>
          <strong>Здесь появится ваша инфографика</strong>
          <p>
            Сначала загрузите фотографию товара.<br>
            Cardly AI удалит фон и подготовит изображение.
          </p>
        </div>
      </div>

      <div class="card-wrapper" id="cardWrapper">
        <div class="card" id="card"></div>
      </div>
    </section>
  </div>
</main>

<script type="module">
import {
  AutoModel,
  AutoProcessor,
  RawImage,
  env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const MODEL_ID = "onnx-community/BiRefNet_512x512-ONNX";

// Настройки загрузки модели через Worker.
env.allowRemoteModels = true;
env.remoteHost = window.location.origin + "/api/model/";
env.remotePathTemplate = "{model}/resolve/{revision}";
env.useBrowserCache = true;

// Настройки ONNX Runtime.
env.backends.onnx.wasm.numThreads = Math.min(
  4,
  navigator.hardwareConcurrency || 4
);

const imageInput = document.getElementById("imageInput");
const uploadContent = document.getElementById("uploadContent");
const uploadBox = document.getElementById("uploadBox");
const removeStatus = document.getElementById("removeStatus");
const statusText = document.getElementById("statusText");
const progressBar = document.getElementById("progressBar");
const productName = document.getElementById("productName");
const featuresInput = document.getElementById("featuresInput");
const generateBtn = document.getElementById("generateBtn");
const aiSceneBtn = document.getElementById("aiSceneBtn");
const styleSelect = document.getElementById("styleSelect");
const variantBtn = document.getElementById("variantBtn");
const downloadBtn = document.getElementById("downloadBtn");
const emptyPreview = document.getElementById("emptyPreview");
const cardWrapper = document.getElementById("cardWrapper");
const card = document.getElementById("card");

let cutoutImage = null;
let modelPromise = null;
let isRemoving = false;
let sceneObjectUrl = null;

function setStatus(message, type = "loading", progress = 0) {
  removeStatus.className = "status " + type;
  removeStatus.style.display = "block";
  statusText.textContent = message;
  progressBar.style.width = progress + "%";
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();

    image.onload = () => resolve(image);
    image.onerror = () => reject(
      new Error("Не удалось открыть фотографию")
    );

    image.src = src;
  });
}

async function getModel() {
  if (!modelPromise) {
    modelPromise = (async () => {
      setStatus(
        "Загружаем модель BiRefNet. Файл около 940 МБ — первая загрузка может занять время…",
        "loading",
        5
      );

      const processor = await AutoProcessor.from_pretrained(MODEL_ID);

      const model = await AutoModel.from_pretrained(MODEL_ID, {
        dtype: "fp32",
        device: "wasm",
        progress_callback: (event) => {
          if (event.status === "progress" && event.total) {
            const percent = Math.round(
              (event.loaded / event.total) * 75
            );

            setStatus(
              "Загрузка модели BiRefNet… " + percent + "%",
              "loading",
              Math.max(5, percent)
            );
          }
        }
      });

      return { model, processor };
    })().catch(error => {
      modelPromise = null;
      throw error;
    });
  }

  return modelPromise;
}

async function removeBackground(file) {
  if (isRemoving) return;

  isRemoving = true;
  generateBtn.disabled = true;
  aiSceneBtn.disabled = true;

  let sourceUrl = null;

  try {
    setStatus("Подготавливаем фотографию…", "loading", 3);

    sourceUrl = URL.createObjectURL(file);
    const sourceImage = await loadImage(sourceUrl);

    if (sourceImage.width > 5000 || sourceImage.height > 5000) {
      throw new Error(
        "Слишком большое изображение. Используйте фото до 5000 пикселей по каждой стороне."
      );
    }

    const { model, processor } = await getModel();

    setStatus(
      "AI анализирует изображение. Обработка на процессоре может занять несколько минут…",
      "loading",
      85
    );

    const rawImage = await RawImage.fromURL(sourceUrl);
    const { pixel_values } = await processor(rawImage);

    const { output_image } = await model({
      input_image: pixel_values
    });

    const maskTensor = output_image[0]
      .sigmoid()
      .mul(255)
      .to("uint8");

    const mask = await RawImage.fromTensor(maskTensor)
      .resize(sourceImage.width, sourceImage.height);

    setStatus("Создаём PNG с прозрачным фоном…", "loading", 94);

    const width = sourceImage.width;
    const height = sourceImage.height;

    const resultCanvas = document.createElement("canvas");
    resultCanvas.width = width;
    resultCanvas.height = height;

    const ctx = resultCanvas.getContext("2d", {
      willReadFrequently: true
    });

    ctx.drawImage(sourceImage, 0, 0, width, height);

    const maskCanvas = document.createElement("canvas");
    maskCanvas.width = width;
    maskCanvas.height = height;

    const maskCtx = maskCanvas.getContext("2d");
    const maskPixels = maskCtx.createImageData(width, height);

    const channels = mask.channels ||
      Math.max(1, Math.round(mask.data.length / (width * height)));

    for (let i = 0; i < width * height; i++) {
      const alpha = mask.data[i * channels];
      const p = i * 4;

      maskPixels.data[p] = 255;
      maskPixels.data[p + 1] = 255;
      maskPixels.data[p + 2] = 255;
      maskPixels.data[p + 3] = alpha;
    }

    maskCtx.putImageData(maskPixels, 0, 0);

    ctx.globalCompositeOperation = "destination-in";
    ctx.drawImage(maskCanvas, 0, 0);
    ctx.globalCompositeOperation = "source-over";

    cutoutImage = resultCanvas.toDataURL("image/png");

    uploadContent.innerHTML = "";

    const preview = document.createElement("img");
    preview.className = "upload-preview";
    preview.src = cutoutImage;
    preview.alt = "Товар без фона";

    uploadContent.appendChild(preview);
    uploadBox.classList.add("checker");

    setStatus(
      "Фон удалён. Товар готов к оформлению.",
      "success",
      100
    );

    generateBtn.disabled = false;
    aiSceneBtn.disabled = false;

  } catch (error) {
    console.error("BACKGROUND REMOVAL ERROR:", error);

    setStatus(
      "Не удалось удалить фон: " + error.message,
      "error",
      0
    );

    generateBtn.disabled = true;
    aiSceneBtn.disabled = true;

  } finally {
    if (sourceUrl) URL.revokeObjectURL(sourceUrl);
    isRemoving = false;
  }
}

imageInput.addEventListener("change", async () => {
  const file = imageInput.files?.[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    setStatus("Выберите файл изображения.", "error");
    return;
  }

  cutoutImage = null;
  generateBtn.disabled = true;
  aiSceneBtn.disabled = true;

  if (sceneObjectUrl) {
    URL.revokeObjectURL(sceneObjectUrl);
    sceneObjectUrl = null;
  }

  uploadContent.innerHTML =
    '<div class="upload-content"><div class="upload-icon">◌</div><div class="upload-title">Обрабатываем фото…</div></div>';

  await removeBackground(file);
});

async function requestDesign() {
  const response = await fetch("/api/generate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      productName: productName.value.trim(),
      characteristics: featuresInput.value.trim()
    })
  });

  const data = await response.json();

  if (!response.ok || data.error) {
    throw new Error(data.error || "Не удалось создать дизайн");
  }

  return data;
}

async function requestAIScene() {
  const response = await fetch("/api/generate-scene", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      productName: productName.value.trim(),
      characteristics: featuresInput.value.trim(),
      style: styleSelect.value
    })
  });

  if (!response.ok) {
    let message = "Не удалось создать AI-фон";

    try {
      const errorData = await response.json();
      message = errorData.error || message;
    } catch (_) {}

    throw new Error(message);
  }

  const blob = await response.blob();

  if (!blob.type.startsWith("image/")) {
    throw new Error("Сервер вернул файл неправильного формата.");
  }

  return blob;
}

async function renderCard(data, sceneUrl = null) {
  const designOptions = [
    "hero", "split", "editorial", "dynamic", "info", "premium"
  ];

  const backgroundOptions = [
    "light", "dark", "soft", "gradient", "accent"
  ];

  const accentOptions = [
    "blue", "cyan", "green", "orange", "violet", "black"
  ];

  const positionOptions = ["left", "center", "right"];
  const titleOptions = ["top", "middle", "bottom"];
  const featureOptions = ["left", "right", "bottom"];

  const design = designOptions.includes(data.design)
    ? data.design : "hero";

  const background = backgroundOptions.includes(data.background)
    ? data.background : "light";

  const accent = accentOptions.includes(data.accent)
    ? data.accent : "blue";

  const productPosition = positionOptions.includes(data.productPosition)
    ? data.productPosition : "center";

  const titlePosition = titleOptions.includes(data.titlePosition)
    ? data.titlePosition : "top";

  const featuresPosition = featureOptions.includes(data.featuresPosition)
    ? data.featuresPosition : "bottom";

  const title = escapeHTML(data.title || productName.value);
  const subtitle = escapeHTML(data.subtitle || "");

  const features = Array.isArray(data.features)
    ? data.features.slice(0, 4)
    : [];

  card.className =
    `card ${design} ${background === "dark" ? "dark" : ""} accent-${accent}`;

  const backgroundStyles = {
    light: "",
    dark: "",
    soft: "background:linear-gradient(145deg,#f7f7f5,#e9edf2);",
    gradient: "background:radial-gradient(circle at 80% 15%,#d8e8ff,transparent 40%),linear-gradient(145deg,#fff,#e9f0fb);",
    accent: "background:linear-gradient(145deg,#eaf0ff,#d9e5ff);"
  };

  card.style.background = "";

  if (backgroundStyles[background]) {
    card.setAttribute("style", backgroundStyles[background]);
  } else {
    card.removeAttribute("style");
  }

  const featureHTML = features.map(item =>
    `<div class="feature">${escapeHTML(item)}</div>`
  ).join("");

  const labels = {
    hero: "PRODUCT FOCUS",
    split: "MODERN LAYOUT",
    editorial: "EDITORIAL",
    dynamic: "DYNAMIC",
    info: "PRODUCT DETAILS",
    premium: "PREMIUM"
  };

  card.innerHTML = `
    ${
      sceneUrl
        ? `<img class="scene-background" src="${sceneUrl}" alt="AI-фон">`
        : ""
    }

    ${sceneUrl ? `<div class="scene-overlay"></div>` : ""}

    <div class="design-label">${labels[design]}</div>

    <h2 class="card-title title-${titlePosition}">
      ${title}
    </h2>

    ${
      subtitle
        ? `<div class="card-subtitle">${subtitle}</div>`
        : ""
    }

    <img
      class="product ${productPosition}"
      src="${cutoutImage}"
      alt="Товар"
    >

    <div class="features ${featuresPosition}">
      ${featureHTML}
    </div>
  `;

  if (sceneUrl) {
    const sceneImage = card.querySelector(".scene-background");

    try {
      await sceneImage.decode();
    } catch (error) {
      console.warn("Не удалось загрузить AI-фон:", error);
    }
  }

  emptyPreview.style.display = "none";
  cardWrapper.style.display = "flex";
  variantBtn.style.display = "inline-block";
  downloadBtn.style.display = "inline-block";
}

async function generateCard() {
  if (!cutoutImage) {
    alert("Сначала загрузите фото и дождитесь удаления фона.");
    return;
  }

  if (!productName.value.trim()) {
    alert("Введите название товара.");
    return;
  }

  generateBtn.disabled = true;
  aiSceneBtn.disabled = true;
  generateBtn.textContent = "Создаём дизайн…";

  try {
    const data = await requestDesign();
    await renderCard(data);

    if (sceneObjectUrl) {
      URL.revokeObjectURL(sceneObjectUrl);
      sceneObjectUrl = null;
    }

  } catch (error) {
    alert("Ошибка: " + error.message);

  } finally {
    generateBtn.disabled = false;
    aiSceneBtn.disabled = false;
    generateBtn.textContent = "✨ Создать карточку";
  }
}

async function generateAIComposition() {
  if (!cutoutImage) {
    alert("Сначала загрузите фото товара.");
    return;
  }

  if (!productName.value.trim()) {
    alert("Введите название товара.");
    return;
  }

  aiSceneBtn.disabled = true;
  generateBtn.disabled = true;
  variantBtn.disabled = true;

  aiSceneBtn.textContent = "✦ Создаём рекламную сцену…";

  let newSceneUrl = null;

  try {
    // Сначала создаём структуру карточки.
    const design = await requestDesign();

    aiSceneBtn.textContent = "✦ Генерируем AI-фон…";

    // Затем генерируем отдельное окружение.
    const sceneBlob = await requestAIScene();

    newSceneUrl = URL.createObjectURL(sceneBlob);

    // Накладываем исходный товар поверх AI-фона.
    await renderCard(design, newSceneUrl);

    if (sceneObjectUrl) {
      URL.revokeObjectURL(sceneObjectUrl);
    }

    sceneObjectUrl = newSceneUrl;
    newSceneUrl = null;

  } catch (error) {
    console.error("AI COMPOSITION ERROR:", error);
    alert("Не удалось создать композицию: " + error.message);

  } finally {
    if (newSceneUrl) {
      URL.revokeObjectURL(newSceneUrl);
    }

    aiSceneBtn.disabled = false;
    generateBtn.disabled = false;
    variantBtn.disabled = false;

    aiSceneBtn.textContent = "✦ Создать AI-композицию";
  }
}

generateBtn.addEventListener("click", generateCard);

aiSceneBtn.addEventListener("click", generateAIComposition);

variantBtn.addEventListener("click", async () => {
  variantBtn.disabled = true;
  variantBtn.textContent = "Создаём…";

  try {
    const data = await requestDesign();
    await renderCard(data);

    if (sceneObjectUrl) {
      URL.revokeObjectURL(sceneObjectUrl);
      sceneObjectUrl = null;
    }

  } catch (error) {
    alert("Ошибка: " + error.message);

  } finally {
    variantBtn.disabled = false;
    variantBtn.textContent = "Другой вариант";
  }
});

downloadBtn.addEventListener("click", async () => {
  downloadBtn.disabled = true;
  downloadBtn.textContent = "Готовим PNG…";

  try {
    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: null
    });

    const finalCanvas = document.createElement("canvas");
    finalCanvas.width = 900;
    finalCanvas.height = 1200;

    const ctx = finalCanvas.getContext("2d");
    ctx.drawImage(canvas, 0, 0, 900, 1200);

    const link = document.createElement("a");
    link.download = "cardly-ai-900x1200.png";
    link.href = finalCanvas.toDataURL("image/png");
    link.click();

  } catch (error) {
    alert("Не удалось сохранить PNG: " + error.message);

  } finally {
    downloadBtn.disabled = false;
    downloadBtn.textContent = "Скачать PNG";
  }
});
</script>
